version: "2"

run:
  build-tags:
    - integration
    - contract
    - bundle
    - vm

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - whitespace
  settings:
    misspell:
      locale: US
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      - path: server/internal/testdb/
        linters: [gosec]
      # The agent's Windows files call Windows APIs that take pointers to
      # documented structures; those conversions are the API boundary and
      # are reviewed with the structures. Other gosec rules still apply.
      - path: agent/.*windows.*\.go
        linters: [gosec]
        text: "G103:"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/paulmataruso/easyrmm
