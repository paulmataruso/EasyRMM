version: "2"

run:
  build-tags:
    - integration
    - contract
    - bundle
    - vm

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - whitespace
  settings:
    misspell:
      locale: US
      # ADR-0078's names: the licence class, and the requirement class "organisational".
      ignore-rules:
        - licence
        - organisational
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
      - path: server/internal/testdb/
        linters: [gosec]
      # Test helper: reads make test-mail's env.json and Mailpit's API.
      - path: server/internal/testmail/
        linters: [gosec, noctx]
      # The agent's Windows files call Windows APIs that take pointers to
      # documented structures; those conversions are the API boundary and
      # are reviewed with the structures. Other gosec rules still apply.
      - path: agent/.*windows.*\.go
        linters: [gosec]
        text: "G103:"
      # So do the Windows tests' helpers, for registry calls x/sys does not
      # wrap (a registry link). Other gosec rules still apply.
      - path: internal/wintest/
        linters: [gosec]
        text: "G103:"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/paulmataruso/easyrmm
