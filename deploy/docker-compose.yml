# EasyRMM server deployment.
#
#   cd deploy && ./scripts/setup.sh --hostname rmm.example.com --acme-email you@example.com
#   docker compose up -d
#
# Every service uses host networking: there are no bridge networks and no
# port mappings. Internal services listen on loopback only; the server's TLS
# edge is the only public listener (443, plus 80 for ACME HTTP-01 and
# redirects). MeshCentral is reached only through that edge, on its own
# hostname. See docs/deployment/docker.md and docs/architecture/network.md.

name: easyrmm

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# The patching engine's settings, shared by its services below. Its secrets
# are not marked required (:?) here, so that an .env that predates them
# still lets `docker compose` start, stop and back up the rest; setup.sh adds
# them. easypatch-db-init refuses to run without them instead, and nothing
# else of the engine starts until it has.
x-easypatch-env: &easypatch-env
  ASPNETCORE_ENVIRONMENT: Production
  TZ: UTC
  Database__Host: 127.0.0.1
  Database__Port: "15432"
  Database__Name: easypatch
  Database__User: easypatch_app
  Database__Password: ${EASYPATCH_DB_APP_PASSWORD:-}
  # Two services of 20 each, beside EasyRMM's 20, under max_connections 200.
  Database__MaxPoolSize: "20"
  # Agents reach the engine on EasyRMM's own address (the edge forwards
  # their paths), so install scripts and package links name it.
  EasyPatch__PublicUrl: ${EASYRMM_PUBLIC_URL:?missing in .env}

x-easypatch-hardening: &easypatch-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# Authentik's settings, shared by its services below (profile "authentik",
# which setup.sh --with-authentik sets; ADR-0044). As with the engine's, its
# secrets are not marked required (:?): authentik-db-init and start.sh refuse
# to run without them instead.
x-authentik-env: &authentik-env
  AUTHENTIK_POSTGRESQL__HOST: 127.0.0.1
  AUTHENTIK_POSTGRESQL__PORT: "15432"
  AUTHENTIK_POSTGRESQL__NAME: authentik
  AUTHENTIK_POSTGRESQL__USER: authentik
  AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-}
  AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-}
  AUTHENTIK_WEB__BASE_URL: https://${EASYRMM_AUTHENTIK_HOSTNAME:-}
  # No update checks, analytics or error reports leave the server.
  AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
  AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
  AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  # Only EasyRMM's edge, on loopback, may say who the client is.
  AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: 127.0.0.0/8,::1/128
  # Empty: no metrics listener.
  AUTHENTIK_LISTEN__METRICS: ""
  # No outposts: no Docker or Kubernetes discovery, no embedded proxy.
  AUTHENTIK_OUTPOSTS__DISCOVER: "false"
  AUTHENTIK_OUTPOSTS__DISABLE_EMBEDDED_OUTPOST: "true"
  # For EasyRMM's blueprint (docker/authentik/blueprints/easyrmm.yaml).
  EASYRMM_PUBLIC_URL: ${EASYRMM_PUBLIC_URL:?missing in .env}
  EASYRMM_AUTHENTIK_CLIENT_SECRET: ${EASYRMM_AUTHENTIK_CLIENT_SECRET:-}

x-authentik-hardening: &authentik-hardening
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# The image's own check, with time for the first start, which migrates
# Authentik's database: minutes on a small server. authentik-setup waits for
# the worker to be healthy, so the first `docker compose up -d` waits too.
x-authentik-healthcheck: &authentik-healthcheck
  test: ["CMD", "ak", "healthcheck"]
  interval: 15s
  timeout: 30s
  retries: 3
  start_period: 15m

services:
  postgres:
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    network_mode: host
    restart: unless-stopped
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - port=15432
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=2000
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh to create deploy/.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
      EASYRMM_DB_OWNER_PASSWORD: ${EASYRMM_DB_OWNER_PASSWORD:?missing in .env}
      EASYRMM_DB_APP_PASSWORD: ${EASYRMM_DB_APP_PASSWORD:?missing in .env}
    volumes:
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/postgres:/var/lib/postgresql
      - ../docker/postgres/init:/docker-entrypoint-initdb.d:ro
    shm_size: 256m
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "15432", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

  server:
    image: ${EASYRMM_IMAGE:-ghcr.io/paulmataruso/easyrmm-server}:${EASYRMM_VERSION:-latest}
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    network_mode: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EASYRMM_PUBLIC_URL: ${EASYRMM_PUBLIC_URL:?missing in .env}
      EASYRMM_MESH_PUBLIC_URL: ${EASYRMM_MESH_PUBLIC_URL:-}
      # Empty: acme for a DNS name, internal for an IP address (ADR-0016).
      EASYRMM_TLS_MODE: ${EASYRMM_TLS_MODE:-}
      EASYRMM_ACME_EMAIL: ${EASYRMM_ACME_EMAIL:-}
      EASYRMM_LISTEN_HTTP: ${EASYRMM_LISTEN_HTTP-:80}
      EASYRMM_LISTEN_HTTPS: ${EASYRMM_LISTEN_HTTPS:-:443}
      EASYRMM_TLS_CERT_FILE: ${EASYRMM_TLS_CERT_FILE:-}
      EASYRMM_TLS_KEY_FILE: ${EASYRMM_TLS_KEY_FILE:-}
      EASYRMM_TRUSTED_PROXIES: ${EASYRMM_TRUSTED_PROXIES:-}
      EASYRMM_DATABASE_URL: postgres://easyrmm_app:${EASYRMM_DB_APP_PASSWORD}@127.0.0.1:15432/easyrmm?sslmode=disable
      EASYRMM_DATABASE_MIGRATION_URL: postgres://easyrmm_owner:${EASYRMM_DB_OWNER_PASSWORD}@127.0.0.1:15432/easyrmm?sslmode=disable
      EASYRMM_SECRET_KEY: ${EASYRMM_SECRET_KEY:?missing in .env}
      EASYRMM_SECRET_KEY_ID: ${EASYRMM_SECRET_KEY_ID:-k1}
      EASYRMM_SECRET_KEYS_PREVIOUS: ${EASYRMM_SECRET_KEYS_PREVIOUS:-}
      EASYRMM_REQUIRE_MFA: ${EASYRMM_REQUIRE_MFA:-true}
      EASYRMM_SESSION_IDLE_TIMEOUT: ${EASYRMM_SESSION_IDLE_TIMEOUT:-}
      EASYRMM_SESSION_MAX_AGE: ${EASYRMM_SESSION_MAX_AGE:-}
      EASYRMM_PASSWORD_RESET_TTL: ${EASYRMM_PASSWORD_RESET_TTL:-}
      EASYRMM_AUDIT_RETENTION: ${EASYRMM_AUDIT_RETENTION:-}
      EASYRMM_JOB_RETENTION: ${EASYRMM_JOB_RETENTION:-}
      EASYRMM_JOB_OUTPUT_RETENTION: ${EASYRMM_JOB_OUTPUT_RETENTION:-}
      EASYRMM_METRICS_RETENTION: ${EASYRMM_METRICS_RETENTION:-}
      EASYRMM_ALERT_RETENTION: ${EASYRMM_ALERT_RETENTION:-}
      EASYRMM_HARDWARE_RETENTION: ${EASYRMM_HARDWARE_RETENTION:-}
      EASYRMM_AGENT_LOG_RETENTION_DAYS: ${EASYRMM_AGENT_LOG_RETENTION_DAYS:-}
      EASYRMM_AGENT_CHANNEL: ${EASYRMM_AGENT_CHANNEL:-}
      EASYRMM_AGENT_CONNECTIONS_MAX: ${EASYRMM_AGENT_CONNECTIONS_MAX:-}
      EASYRMM_ACME_DIRECTORY: ${EASYRMM_ACME_DIRECTORY:-}
      EASYRMM_ACME_CA_FILE: ${EASYRMM_ACME_CA_FILE:-}
      # Set, the mail server is .env's; empty, the console's (Settings ->
      # Notifications -> Mail server).
      EASYRMM_SMTP_HOST: ${EASYRMM_SMTP_HOST:-}
      EASYRMM_SMTP_PORT: ${EASYRMM_SMTP_PORT:-587}
      EASYRMM_SMTP_USERNAME: ${EASYRMM_SMTP_USERNAME:-}
      EASYRMM_SMTP_PASSWORD: ${EASYRMM_SMTP_PASSWORD:-}
      EASYRMM_SMTP_FROM: ${EASYRMM_SMTP_FROM:-}
      EASYRMM_SMTP_TLS: ${EASYRMM_SMTP_TLS:-starttls}
      # Microsoft 365 (ADR-0053): an Entra application's sign-in, its secret
      # or certificate and key in files under the data root's secrets/,
      # named here by their paths in the container (/run/secrets/easyrmm).
      EASYRMM_SMTP_AUTH: ${EASYRMM_SMTP_AUTH:-}
      EASYRMM_SMTP_TENANT_ID: ${EASYRMM_SMTP_TENANT_ID:-}
      EASYRMM_SMTP_CLIENT_ID: ${EASYRMM_SMTP_CLIENT_ID:-}
      EASYRMM_SMTP_CLIENT_SECRET_FILE: ${EASYRMM_SMTP_CLIENT_SECRET_FILE:-}
      EASYRMM_SMTP_CLIENT_CERT_FILE: ${EASYRMM_SMTP_CLIENT_CERT_FILE:-}
      EASYRMM_SMTP_CLIENT_KEY_FILE: ${EASYRMM_SMTP_CLIENT_KEY_FILE:-}
      EASYRMM_LOG_LEVEL: ${EASYRMM_LOG_LEVEL:-info}
      EASYRMM_KEYSTORE_SOCKET: /run/easyrmm-keystore/keystore.sock
      EASYRMM_MESH_ENABLED: ${EASYRMM_MESH_ENABLED:-true}
      EASYRMM_MESH_CERT_URL: ${EASYRMM_MESH_CERT_URL:-}
      EASYRMM_IP_ACCESS: ${EASYRMM_IP_ACCESS:-true}
      EASYRMM_IP_ADDRESSES: ${EASYRMM_IP_ADDRESSES:-}
      EASYRMM_IP_MESH_PORT: ${EASYRMM_IP_MESH_PORT:-4443}
      # EasyPatch on this server behind the edge was retired (ADR-0046):
      # passed only so that the server refuses an .env that still names it.
      EASYRMM_EASYPATCH_HOSTNAME: ${EASYRMM_EASYPATCH_HOSTNAME:-}
      # The patching engine in this deployment is called on loopback with
      # statements signed by this key (ADR-0038); setup.sh generates it.
      EASYRMM_PATCHING_KEY: ${EASYRMM_PATCHING_KEY:-}
      # An imported EasyPatch's names: its agents keep reaching the engine
      # there, through EasyRMM's edge.
      EASYRMM_PATCHING_AGENT_HOSTNAMES: ${EASYRMM_PATCHING_AGENT_HOSTNAMES:-}
      # Authentik in this deployment (ADR-0044; setup.sh --with-authentik):
      # its sign-in name, served by this edge, and the first administrator.
      # Empty: no Authentik.
      EASYRMM_AUTHENTIK_HOSTNAME: ${EASYRMM_AUTHENTIK_HOSTNAME:-}
      EASYRMM_AUTHENTIK_ADMIN_EMAIL: ${EASYRMM_AUTHENTIK_ADMIN_EMAIL:-}
      EASYRMM_AUTHENTIK_CLIENT_SECRET: ${EASYRMM_AUTHENTIK_CLIENT_SECRET:-}
    volumes:
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/server:/var/lib/easyrmm
      - ${EASYRMM_TLS_DIR:-/srv/easyrmm/tls}:/etc/easyrmm/tls:ro
      # The server writes MeshCentral's configuration here (it holds the
      # shared login key); MeshCentral mounts it read-only.
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/meshcentral-config:/var/lib/easyrmm-meshcentral
      # The updater's status (ADR-0052), root's: while its hold file exists
      # the server answers its health check and nothing else.
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/updater/status:/run/easyrmm-updater:ro
      # Secrets setup.sh keeps out of .env (root:65532, 0750, files 0440).
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/secrets:/run/secrets/easyrmm:ro
      # The keystore's service socket (ADR-0081), nothing else of it: the
      # server holds no key and reaches the keystore only through this.
      - ${EASYRMM_KEYSTORE_DIR:-/var/lib/easyrmm-keystore}/run:/run/easyrmm-keystore:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # no-new-privileges is deliberately not set: it would stop the binary's
    # cap_net_bind_service file capability from taking effect. The image has
    # no setuid binaries and the container keeps no other capability.
    stop_grace_period: 30s
    logging: *logging

  # The keystore (ADR-0081): holds the key-encryption key for BitLocker and LUKS
  # recovery keys and does every wrap and check. It is the one service with
  # NO network at all (not bridge, not host): it is reached only through the
  # Unix socket in the state directory's run/ folder. The state directory is
  # outside the data root and the deployment directory, so no backup and no
  # updater copy holds it (docs/operations/keystore.md). It runs the server
  # image's second binary, so it is pulled and verified with the server.
  # No depends_on in either direction: a sealed keystore is a normal state,
  # and the server runs without it.
  keystore:
    image: ${EASYRMM_IMAGE:-ghcr.io/paulmataruso/easyrmm-server}:${EASYRMM_VERSION:-latest}
    network_mode: none
    restart: unless-stopped
    user: "65531:65532"
    entrypoint: ["/usr/local/bin/easyrmm-keystore"]
    command: ["serve"]
    environment:
      # Empty: a TPM where the host has one, else a passphrase typed at the
      # host. "file" is the named stand-in, on only when set here on purpose.
      EASYRMM_KEYSTORE_MODE: ${EASYRMM_KEYSTORE_MODE:-}
    volumes:
      - ${EASYRMM_KEYSTORE_DIR:-/var/lib/easyrmm-keystore}:/var/lib/easyrmm-keystore
      - ${EASYRMM_KEYSTORE_DIR:-/var/lib/easyrmm-keystore}/run:/run/easyrmm-keystore
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      # The admin socket (init, unseal, verify-recovery): inside this
      # container only, so only `docker compose exec` at the host reaches it.
      - /run/keystore-admin:size=64k,mode=0700,uid=65531,gid=65532
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The host's TPM, when setup.sh found one: its resource-managed device
    # (never /dev/tpm0), opened by the group that owns it. Without one both
    # are harmless (/dev/null onto itself, and the server's own group).
    devices:
      - ${EASYRMM_TPM_DEVICE:-/dev/null}:${EASYRMM_TPM_DEVICE:-/dev/null}
    group_add: ["${EASYRMM_TPM_GID:-65532}"]
    # The key is held in locked memory, never swapped, never dumped.
    ulimits:
      memlock: {soft: -1, hard: -1}
      core: {soft: 0, hard: 0}
    mem_limit: 256m
    memswap_limit: 256m
    stop_grace_period: 10s
    healthcheck:
      # Passes when the keystore answers, sealed or not: it never waits for
      # an unseal (ADR-0052).
      test: ["CMD", "/usr/local/bin/easyrmm-keystore", "status", "--quiet"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging: *logging

  # Remote desktop, terminal and file access (ADR-0004, ADR-0005). It listens
  # on 127.0.0.1:14430 only; agents and browsers reach it through the
  # server's edge on the MeshCentral hostname, which admits browsers only
  # with a session launched from the EasyRMM console. The start script waits
  # for the configuration the server writes, creates the service account
  # EasyRMM acts as, and restarts MeshCentral when the configuration changes.
  # Set EASYRMM_MESH_ENABLED=false and run `docker compose up -d server
  # postgres` to run without remote access.
  meshcentral:
    image: ghcr.io/ylianst/meshcentral:1.3.1@sha256:266b01942545829f11d53e6cecd5c2e48033d9edb48bbd3a9a569482ff1d050d
    network_mode: host
    restart: unless-stopped
    user: "65532:65532"
    entrypoint: ["/bin/bash", "/easyrmm/start.sh"]
    environment:
      HOME: /tmp
    volumes:
      - ../docker/meshcentral/start.sh:/easyrmm/start.sh:ro
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/meshcentral-config:/easyrmm/config:ro
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/meshcentral/data:/opt/meshcentral/meshcentral-data
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/meshcentral/files:/opt/meshcentral/meshcentral-files
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/meshcentral/backups:/opt/meshcentral/meshcentral-backups
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:14430/health.ashx"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start downloads the agent binaries (about 120 MiB).
      start_period: 5m
    logging: *logging

  # --- Patching engine (EasyPatch) --------------------------------------------
  # EasyRMM's patching engine inside this deployment (ADR-0038). EasyRMM's
  # patching pages use it, and EasyPatch agents reach it through EasyRMM's
  # edge (ADR-0039).
  #
  # Everything listens on loopback only: the API on 127.0.0.1:18180, the
  # worker's health endpoint on 127.0.0.1:18181. ASPNETCORE_URLS sets the
  # address; ASPNETCORE_HTTP_PORTS, which the image sets, would bind every
  # interface, so it is emptied.

  # Creates the engine's database and roles, or brings them up to date: also
  # on an existing install, where PostgreSQL's init scripts never run again.
  easypatch-db-init:
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    network_mode: host
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    user: "70:70"
    entrypoint: ["/bin/sh", "/easyrmm/easypatch-db-init.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh to create deploy/.env}
      EASYPATCH_DB_OWNER_PASSWORD: ${EASYPATCH_DB_OWNER_PASSWORD:-}
      EASYPATCH_DB_APP_PASSWORD: ${EASYPATCH_DB_APP_PASSWORD:-}
    volumes:
      - ../docker/postgres/easypatch-db-init.sh:/easyrmm/easypatch-db-init.sh:ro
    <<: *easypatch-hardening
    logging: *logging

  # Applies the engine's database migrations, as the owner role, then exits.
  easypatch-migrate:
    image: ${EASYPATCH_IMAGE:-ghcr.io/paulmataruso/easypatch-server}:${EASYPATCH_VERSION:-dev}
    build:
      context: ../easypatch
      dockerfile: deployment/server/Dockerfile
    network_mode: host
    restart: "no"
    depends_on:
      easypatch-db-init:
        condition: service_completed_successfully
    command: ["migrate"]
    environment:
      <<: *easypatch-env
      Database__User: easypatch_owner
      Database__Password: ${EASYPATCH_DB_OWNER_PASSWORD:-}
      Database__MaxPoolSize: "2"
    <<: *easypatch-hardening
    logging: *logging

  easypatch-api:
    image: ${EASYPATCH_IMAGE:-ghcr.io/paulmataruso/easypatch-server}:${EASYPATCH_VERSION:-dev}
    network_mode: host
    restart: unless-stopped
    depends_on:
      easypatch-migrate:
        condition: service_completed_successfully
    environment:
      <<: *easypatch-env
      ASPNETCORE_URLS: http://127.0.0.1:18180
      ASPNETCORE_HTTP_PORTS: ""
      # The key EasyRMM signs its calls with (ADR-0038); the server reads
      # the same one. Only the API checks statements.
      EasyRmm__GatewayKey: ${EASYRMM_PATCHING_KEY:-}
    volumes:
      # Agent packages come with the image, release-signed (ADR-0041): no
      # directory here, which would hide them.
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/easypatch/keys:/app/keys
      # The server's copy of winget for agents that cannot reach GitHub,
      # downloaded by the worker.
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/easypatch/winget:/app/winget:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18180/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    <<: *easypatch-hardening
    stop_grace_period: 30s
    logging: *logging

  # Background work: update catalogues, schedules, reports, notifications.
  # Outbound HTTPS: Microsoft's update and security feeds, CISA's catalogue of
  # exploited vulnerabilities, the Debian security tracker, GitHub (winget),
  # and whatever mail server and webhooks are configured.
  easypatch-worker:
    image: ${EASYPATCH_IMAGE:-ghcr.io/paulmataruso/easypatch-server}:${EASYPATCH_VERSION:-dev}
    network_mode: host
    restart: unless-stopped
    # After the API: the API creates the data-protection key on its first
    # start, and the worker, which only reads the keys, would otherwise find
    # none.
    depends_on:
      easypatch-api:
        condition: service_healthy
    entrypoint: ["dotnet", "/app/worker/EasyPatch.Worker.dll"]
    working_dir: /app/worker
    environment:
      <<: *easypatch-env
      ASPNETCORE_URLS: http://127.0.0.1:18181
      ASPNETCORE_HTTP_PORTS: ""
    volumes:
      # Read-only: the worker decrypts notification secrets with the keys the
      # API creates.
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/easypatch/keys:/app/keys:ro
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/easypatch/winget:/app/winget
      # The updater's status (ADR-0052), root's, read-only.
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/updater/status:/run/easyrmm-updater:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18181/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    <<: *easypatch-hardening
    stop_grace_period: 30s
    logging: *logging

  # --- Sign-in (Authentik) -----------------------------------------------------
  # Authentik as this deployment's sign-in (ADR-0044). These services start only
  # with the "authentik" profile, which `scripts/setup.sh --with-authentik` adds
  # to COMPOSE_PROFILES in .env. EasyRMM's edge serves Authentik's sign-in name
  # (EASYRMM_AUTHENTIK_HOSTNAME) and forwards it to the server on loopback;
  # Authentik itself listens on loopback only: the server on 127.0.0.1:18280
  # (HTTP) and 18243 (HTTPS), the worker on 127.0.0.1:18281. Its data is the
  # "authentik" database in the same PostgreSQL. Image: Authentik 2026.8.5 (MIT,
  # with the enterprise directory under its own licence, which this deployment
  # never activates).

  # Creates Authentik's database and role, or brings them up to date: also
  # on an existing install, where PostgreSQL's init scripts never run again.
  authentik-db-init:
    image: postgres:18.6-alpine3.24@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    profiles: [authentik]
    network_mode: host
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    user: "70:70"
    entrypoint: ["/bin/sh", "/easyrmm/authentik-db-init.sh"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.sh to create deploy/.env}
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:-}
    volumes:
      - ../docker/postgres/authentik-db-init.sh:/easyrmm/authentik-db-init.sh:ro
    <<: *authentik-hardening
    logging: *logging

  # The web server: sign-in pages, the OpenID provider, its API.
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    profiles: [authentik]
    network_mode: host
    restart: unless-stopped
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    # start.sh gives Authentik akadmin's first password from its file.
    entrypoint: ["/bin/sh", "/easyrmm/bin/start.sh"]
    command: ["server"]
    environment:
      <<: *authentik-env
      AUTHENTIK_LISTEN__HTTP: 127.0.0.1:18280
      AUTHENTIK_LISTEN__HTTPS: 127.0.0.1:18243
    volumes:
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/authentik/data:/data
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/authentik/secrets:/easyrmm/secrets:ro
      - ../docker/authentik:/easyrmm/bin:ro
      - ../docker/authentik/blueprints:/blueprints/easyrmm:ro
    shm_size: 512m
    <<: *authentik-hardening
    stop_grace_period: 30s
    healthcheck: *authentik-healthcheck
    logging: *logging

  # Background work, and the blueprints: EasyRMM's is applied at the first
  # start and whenever the file changes (authentik-setup applies it again
  # when .env changes what it makes).
  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    profiles: [authentik]
    network_mode: host
    restart: unless-stopped
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/easyrmm/bin/start.sh"]
    command: ["worker"]
    environment:
      <<: *authentik-env
      AUTHENTIK_LISTEN__HTTP: 127.0.0.1:18281
    volumes:
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/authentik/data:/data
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/authentik/secrets:/easyrmm/secrets:ro
      - ../docker/authentik:/easyrmm/bin:ro
      - ../docker/authentik/blueprints:/blueprints/easyrmm:ro
    shm_size: 512m
    <<: *authentik-hardening
    stop_grace_period: 30s
    healthcheck: *authentik-healthcheck
    logging: *logging

  # After every start: EasyRMM's blueprint, applied again if Authentik does
  # not match what it makes of .env as it is now, then checked (the worker
  # applies it only when the file changes, and .env is not in the file), the
  # settings blueprints cannot make, and the invitation setup.sh decided, if
  # one is pending (docker/authentik/setup.py). When one of its settings in
  # .env changes, such as EASYRMM_PUBLIC_URL, `docker compose up -d`
  # recreates it with the new one.
  authentik-setup:
    image: ghcr.io/goauthentik/server:2026.8.5@sha256:602227a86455d6772e3d16b7d852713c4f864f40df5df894abd1285bb53979a5
    profiles: [authentik]
    network_mode: host
    restart: "no"
    depends_on:
      authentik-worker:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/easyrmm/bin/start.sh"]
    command: ["shell", "-c", "exec(open('/easyrmm/bin/setup.py').read())"]
    environment:
      <<: *authentik-env
    volumes:
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/authentik/data:/data
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/authentik/secrets:/easyrmm/secrets:ro
      - ${EASYRMM_DATA_ROOT:-/srv/easyrmm}/authentik/invitations:/easyrmm/invitations
      - ../docker/authentik:/easyrmm/bin:ro
      - ../docker/authentik/blueprints:/blueprints/easyrmm:ro
    shm_size: 512m
    <<: *authentik-hardening
    logging: *logging
