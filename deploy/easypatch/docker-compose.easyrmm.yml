# EasyPatch behind EasyRMM on the same server (EasyRMM: docs/deployment/easypatch-cohost.md).
# Use it with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.easyrmm.yml up -d
# EasyRMM keeps ports 80 and 443; Caddy publishes on loopback only, where EasyRMM passes EasyPatch's
# connections to it.
services:
  caddy:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.easyrmm", "--adapter", "caddyfile"]
    environment:
      EASYPATCH_EDGE_SUBNET: ${EASYPATCH_EDGE_SUBNET:-172.30.0.0/24}
    ports: !override
      - "127.0.0.1:19080:80"
      - "127.0.0.1:19443:443"
    volumes:
      - ./Caddyfile.easyrmm:/etc/caddy/Caddyfile.easyrmm:ro
