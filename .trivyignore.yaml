# Trivy findings that do not apply, each scoped to the files it was checked
# against and with the reason. security.yml points Trivy at this file
# (TRIVY_IGNOREFILE). Add an entry only after checking the finding by hand.
misconfigurations:
  # "Specify a non-root USER". These images only build EasyPatch agent
  # packages: the scripts in easypatch/scripts run them once per build with
  # --network none and read-only inputs, and they write the packages to a
  # mounted folder. They are never deployed.
  - id: DS-0002
    paths:
      - "easypatch/agent/Installer/linux/Dockerfile"
      - "easypatch/agent/Installer/linux-packages/Dockerfile"
      - "easypatch/agent/Installer/macos/Dockerfile"
    statement: Build-only images, never deployed.
  # The bundle test's Linux machine (scripts/e2e/bundle.sh, ADR-0043) runs
  # systemd as PID 1, which must be root, so that the EasyRMM and EasyPatch
  # agents are installed as services the way they are on a real machine. It
  # exists only for the length of a test run, on CI's runner or a developer's
  # machine, and is never published or deployed.
  - id: DS-0002
    paths:
      - "scripts/e2e/bundle-host/Dockerfile"
    statement: Test-only machine with systemd as init (root by necessity), never published or deployed.
