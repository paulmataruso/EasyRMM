<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrolling an EasyRMM agent</title>
  <!-- EasyRMM diagram profile: always dark, DESIGN.md tokens, system fonts (no web fonts). -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: #121824; color: #e6ebf2; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: #9aa6b8; margin-bottom: 0.5rem; }
    h1 { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: #e6ebf2; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · EasyRMM</p>
    <h1>Enrolling an EasyRMM agent</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 640" width="960" height="640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agent-enrollment-title agent-enrollment-desc">
        <title id="agent-enrollment-title">Enrolling an EasyRMM agent</title>
        <desc id="agent-enrollment-desc">The agent enrolls with its token and a key it generated; a deployment token creates the device at once, while an approval token makes the agent wait with a device code until a super administrator approves it into a site; the agent then fetches MeshAgent through EasyRMM and starts its heartbeat.</desc>

<marker id="agent-enrollment-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9aa6b8"/></marker>
<marker id="agent-enrollment-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#9aa6b8"/></marker>
<marker id="agent-enrollment-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f8cff"/></marker>
<marker id="agent-enrollment-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#4f8cff"/></marker>
<marker id="agent-enrollment-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#22d3ee"/></marker>
<marker id="agent-enrollment-arrow-link-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#22d3ee"/></marker>

<text x="148" y="202" fill="#9aa6b8" font-size="8" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" letter-spacing="0.04em">[deployment token]</text>

<line x1="160" y1="96" x2="160" y2="572" stroke="rgba(230,235,242,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

<path d="M 480,516 H 160" fill="none" stroke="#9aa6b8" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#agent-enrollment-arrow)"/>

<rect x="298" y="132" width="44" height="12" rx="2" fill="#121824"/>

<rect x="290" y="296" width="60" height="12" rx="2" fill="#121824"/>
<text x="320" y="305" fill="#8793a7" font-size="8" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">202, CODE</text>
<rect x="276" y="332" width="88" height="12" rx="2" fill="#121824"/>
<text x="320" y="341" fill="#22d3ee" font-size="8" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">ASK, HELD 25 S</text>
<rect x="616" y="368" width="48" height="12" rx="2" fill="#121824"/>
<text x="640" y="377" fill="#22d3ee" font-size="8" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">APPROVE</text>
<rect x="276" y="404" width="88" height="12" rx="2" fill="#121824"/>
<text x="320" y="413" fill="#8793a7" font-size="8" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">201, DEVICE ID</text>
<rect x="280" y="460" width="80" height="12" rx="2" fill="#121824"/>
<text x="320" y="469" fill="#22d3ee" font-size="8" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">GET MESHAGENT</text>
<rect x="282" y="496" width="76" height="12" rx="2" fill="#121824"/>
<text x="320" y="505" fill="#8793a7" font-size="8" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">BINARY, .MSH</text>
<rect x="274" y="532" width="92" height="12" rx="2" fill="#121824"/>
<text x="320" y="541" fill="#22d3ee" font-size="8" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">HEARTBEAT, 60 S</text>

<rect x="72" y="48" width="176" height="48" rx="6" fill="#121824"/>
<rect x="72" y="48" width="176" height="48" rx="6" fill="rgba(154,166,184,0.10)" stroke="#8793a7" stroke-width="1"/>
<text x="160" y="70.5" fill="#e6ebf2" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Agent</text>
<text x="160" y="87.5" fill="#9aa6b8" font-size="9" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" text-anchor="middle">installer, then service</text>

<rect x="392" y="48" width="176" height="48" rx="6" fill="#121824"/>
<rect x="392" y="48" width="176" height="48" rx="6" fill="#171e2c" stroke="rgba(230,235,242,0.45)" stroke-width="1"/>
<text x="480" y="70.5" fill="#e6ebf2" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">EasyRMM server</text>
<text x="480" y="87.5" fill="#9aa6b8" font-size="9" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" text-anchor="middle">enrollment API</text>

<rect x="712" y="48" width="176" height="48" rx="6" fill="#121824"/>
<rect x="712" y="48" width="176" height="48" rx="6" fill="rgba(154,166,184,0.10)" stroke="#8793a7" stroke-width="1"/>
<text x="800" y="70.5" fill="#e6ebf2" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">Super administrator</text>

<text x="300" y="612" fill="#9aa6b8" font-size="9" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace">reply</text>
<line x1="355" y1="609" x2="379" y2="609" stroke="#4f8cff" stroke-width="1.2"/>
<text x="387" y="612" fill="#9aa6b8" font-size="9" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace">enrolled at once</text>

</body>
</html>
