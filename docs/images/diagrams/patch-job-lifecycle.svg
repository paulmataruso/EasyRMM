<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 880 436" width="880" height="436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="patch-job-lifecycle-title patch-job-lifecycle-desc" id="patch-job-lifecycle-root">
        <title id="patch-job-lifecycle-title">A patch job&#x27;s lifecycle</title>
        <desc id="patch-job-lifecycle-desc">A patch job is queued, leased to the EasyPatch agent at its next check-in, acknowledged and run; it may wait for a restart and run again, goes back to the queue when a lease expires (at most five deliveries), and ends completed, failed, cancelled or expired.</desc>
        <defs>
      <style>#patch-job-lifecycle-root { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #e6ebf2; }
      #patch-job-lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#patch-job-lifecycle-root .diagram-container { overflow-x: visible; }
}</style>
