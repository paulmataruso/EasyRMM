      <style>#patching-engine-root { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #e6ebf2; }
      #patching-engine-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#patching-engine-root .diagram-container { overflow-x: visible; }
}</style>
