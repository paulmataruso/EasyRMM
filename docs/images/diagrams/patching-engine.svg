<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="patching-engine-title patching-engine-desc" id="patching-engine-root">
        <title id="patching-engine-title">The patching engine</title>
        <desc id="patching-engine-desc">EasyPatch agents reach the patching engine only through EasyRMM&#x27;s address: the EasyRMM server passes their routes to the engine&#x27;s API on loopback and sends it one signed statement per console request; the API and the background worker share the engine&#x27;s PostgreSQL database, whose schema a one-shot migration sets up, and only the worker connects out, for vulnerability feeds, mail and webhooks.</desc>
