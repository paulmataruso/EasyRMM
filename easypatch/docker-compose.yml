# EasyPatch production deployment. See docs/installation.md.
#   ./scripts/init-secrets.sh        # once: database password, data directories, .env
#   docker compose build
#   docker compose up -d
#   docker compose run --rm api create-admin --email you@example.com
name: easypatch

x-server-env: &server-env
  ASPNETCORE_ENVIRONMENT: Production
  Database__Host: postgres
  Database__Port: "5432"
  Database__Name: easypatch
  Database__User: easypatch
  Database__PasswordFile: /run/secrets/db_password
  EasyPatch__PublicUrl: ${EASYPATCH_PUBLIC_URL:-https://${EASYPATCH_DOMAIN:?Set EASYPATCH_DOMAIN in .env}}
  TZ: UTC

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: easypatch
      POSTGRES_USER: easypatch
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - data
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easypatch -d easypatch"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    <<: *logging

  migrate:
    image: ghcr.io/paulmataruso/easypatch-server:${EASYPATCH_VERSION:-1.10.0}
    build:
      context: .
      dockerfile: deployment/server/Dockerfile
    command: ["migrate"]
    environment:
      <<: *server-env
    secrets:
      - db_password
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    <<: [*hardening, *logging]

  api:
    image: ghcr.io/paulmataruso/easypatch-server:${EASYPATCH_VERSION:-1.10.0}
    restart: unless-stopped
    environment:
      <<: *server-env
      ASPNETCORE_HTTP_PORTS: "8080"
      ForwardedHeaders__KnownNetworks: ${EASYPATCH_EDGE_SUBNET:-172.30.0.0/24}
    secrets:
      - db_password
    volumes:
      - dpkeys:/app/keys
      - ./data/agent-packages:/app/agent-packages:ro
      # The server's copy of winget for agents that cannot reach GitHub (downloaded by the worker).
      - winget:/app/winget:ro
    networks:
      - edge
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    <<: [*hardening, *logging]

  worker:
    image: ghcr.io/paulmataruso/easypatch-server:${EASYPATCH_VERSION:-1.10.0}
    restart: unless-stopped
    entrypoint: ["dotnet", "/app/worker/EasyPatch.Worker.dll"]
    working_dir: /app/worker
    environment:
      <<: *server-env
      ASPNETCORE_HTTP_PORTS: "8081"
    secrets:
      - db_password
    volumes:
      # Read-only: the worker decrypts notification secrets with the keys the API creates.
      - dpkeys:/app/keys:ro
      - ./data/agent-packages:/app/agent-packages:ro
      - winget:/app/winget
    networks:
      - data
      - egress # outbound only (SMTP, webhooks, the winget release from GitHub); nothing is published
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    <<: [*hardening, *logging]

  caddy:
    image: ghcr.io/paulmataruso/easypatch-proxy:${EASYPATCH_VERSION:-1.10.0}
    build:
      context: .
      dockerfile: deployment/caddy/Dockerfile
    restart: unless-stopped
    environment:
      EASYPATCH_DOMAIN: ${EASYPATCH_DOMAIN:?Set EASYPATCH_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    <<: *logging

networks:
  edge:
    ipam:
      config:
        - subnet: ${EASYPATCH_EDGE_SUBNET:-172.30.0.0/24}
  data:
    internal: true
  egress: {}

volumes:
  pgdata:
  dpkeys:
  winget:
  caddy_data:
  caddy_config:

secrets:
  db_password:
    file: ./secrets/db_password
