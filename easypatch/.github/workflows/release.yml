# Builds, signs and publishes a release when a version tag (v1.4.0) is pushed:
#   * server and proxy images for x64 and ARM64 on GitHub Container Registry;
#   * Windows MSIs, Linux .deb/.rpm packages and experimental macOS .pkg packages (x64, ARM64), each with a .sig
#     release signature;
#   * a GitHub Release with the packages, SHA256SUMS, the release public key and the CHANGELOG notes.
#
# The release private key is the secret EASYPATCH_RELEASE_KEY of the "release" environment, which only
# v* tags may use. It is written to the runner's temporary directory for signing and deleted afterwards.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NODE_IMAGE: node:24.22.2-alpine3.24
  PUBLIC_KEY: keys/easypatch-release-key.pub.pem

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Tag, Directory.Build.props and CHANGELOG agree
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          props="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' Directory.Build.props)"
          if [ "$version" != "$props" ]; then
            echo "::error::Tag $TAG does not match <Version>$props</Version> in Directory.Build.props"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          grep -q 'BEGIN PUBLIC KEY' "$PUBLIC_KEY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build and test (PostgreSQL via Testcontainers)
        run: |
          dotnet build backend/Tests/EasyPatch.Tests.csproj -c Release
          dotnet test backend/Tests/EasyPatch.Tests.csproj -c Release --no-build

  frontend:
    name: Web console tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install, typecheck, test, build
        run: |
          docker run --rm -v "$PWD/frontend:/src" -w /src "$NODE_IMAGE" \
            sh -c 'npm ci --no-audit --no-fund && npm run typecheck && npm test && npm run build'

  agent-tests:
    name: Agent tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build and test
        run: scripts/build-agent.sh --rid all

  windows-agent:
    name: Windows MSIs
    needs: [prepare, agent-tests]
    runs-on: windows-2025
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build and release-sign the MSIs (x64, arm64)
        shell: pwsh
        env:
          RELEASE_KEY_PEM: ${{ secrets.EASYPATCH_RELEASE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if (-not $env:RELEASE_KEY_PEM) { throw 'The EASYPATCH_RELEASE_KEY secret of the release environment is not set.' }
          $key = Join-Path $env:RUNNER_TEMP 'easypatch-release-key.pem'
          [IO.File]::WriteAllText($key, $env:RELEASE_KEY_PEM)
          $env:RELEASE_KEY_PEM = $null
          $env:EASYPATCH_RELEASE_KEY = $key
          $env:EASYPATCH_RELEASE_PUBLIC_KEY = (Resolve-Path $env:PUBLIC_KEY).Path
          try {
            # build-installer.ps1 verifies each .sig against the public key built into the agent.
            ./scripts/build-agent.ps1 -Version $env:VERSION -Architecture x64,arm64 -SkipTests -RequireReleaseKey
          }
          finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-agent
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.msi.sig
          if-no-files-found: error
          retention-days: 7

  linux-agent:
    name: Linux packages
    needs: [prepare, agent-tests]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build and release-sign the .deb and .rpm packages (x64, arm64)
        env:
          RELEASE_KEY_PEM: ${{ secrets.EASYPATCH_RELEASE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "$RELEASE_KEY_PEM" ]; then
            echo "::error::The EASYPATCH_RELEASE_KEY secret of the release environment is not set."
            exit 1
          fi
          key="$RUNNER_TEMP/easypatch-release-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_KEY_PEM" > "$key")
          unset RELEASE_KEY_PEM
          # build-linux-packages.sh verifies each .sig against the public key built into the agent.
          EASYPATCH_RELEASE_KEY="$key" EASYPATCH_RELEASE_PUBLIC_KEY="$PWD/$PUBLIC_KEY" \
            scripts/build-linux-packages.sh --version "$VERSION" --arch all --no-test
          for package in artifacts/linux/*.deb artifacts/linux/*.rpm; do
            if [ ! -s "$package.sig" ]; then
              echo "::error::$package has no release signature"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-agent
          path: |
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
            artifacts/linux/*.sig
          if-no-files-found: error
          retention-days: 7

  macos-agent:
    name: macOS packages (experimental)
    needs: [prepare, agent-tests]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build and release-sign the .pkg packages (x64, arm64)
        env:
          RELEASE_KEY_PEM: ${{ secrets.EASYPATCH_RELEASE_KEY }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          if [ -z "$RELEASE_KEY_PEM" ]; then
            echo "::error::The EASYPATCH_RELEASE_KEY secret of the release environment is not set."
            exit 1
          fi
          key="$RUNNER_TEMP/easypatch-release-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$RELEASE_KEY_PEM" > "$key")
          unset RELEASE_KEY_PEM
          # build-macos-packages.sh checks each package and verifies each .sig against the public key built into the agent.
          EASYPATCH_RELEASE_KEY="$key" EASYPATCH_RELEASE_PUBLIC_KEY="$PWD/$PUBLIC_KEY" \
            scripts/build-macos-packages.sh --version "$VERSION" --arch all --no-test
          for package in artifacts/macos/*.pkg; do
            if [ ! -s "$package.sig" ]; then
              echo "::error::$package has no release signature"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-agent
          path: |
            artifacts/macos/*.pkg
            artifacts/macos/*.sig
          if-no-files-found: error
          retention-days: 7

  images:
    name: Images (${{ matrix.arch }})
    needs: [prepare, backend, frontend]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          labels=(
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.version=${VERSION}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.licenses=FSL-1.1-ALv2"
            --label "org.opencontainers.image.vendor=DHI Technical Services LLC"
          )
          docker build --pull -f deployment/server/Dockerfile "${labels[@]}" \
            --label "org.opencontainers.image.title=EasyPatch server" \
            --label "org.opencontainers.image.description=EasyPatch API, worker and database migrations" \
            -t "ghcr.io/${owner}/easypatch-server:${VERSION}-${ARCH}" .
          docker build --pull -f deployment/caddy/Dockerfile "${labels[@]}" \
            --label "org.opencontainers.image.title=EasyPatch proxy" \
            --label "org.opencontainers.image.description=Caddy with the EasyPatch web console" \
            -t "ghcr.io/${owner}/easypatch-proxy:${VERSION}-${ARCH}" .
      - name: Check images contain no secrets or source-control metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in "ghcr.io/${owner}/easypatch-server:${VERSION}-${ARCH}" "ghcr.io/${owner}/easypatch-proxy:${VERSION}-${ARCH}"; do
            if docker run --rm --entrypoint sh "$image" -c 'find / -xdev \( -name ".env" -o -name "db_password" -o -name "*.pfx" -o -name "*.pem" -o -name ".git" \) -not -path "/proc/*" -not -path "/etc/ssl/*" -not -path "/etc/ssl1.1/*" -not -path "/usr/share/ca-certificates/*" 2>/dev/null' | grep .; then
              echo "::error::unexpected file in $image"
              exit 1
            fi
          done
      - name: Push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/${owner}/easypatch-server:${VERSION}-${ARCH}"
          docker push "ghcr.io/${owner}/easypatch-proxy:${VERSION}-${ARCH}"
          docker logout ghcr.io

  manifests:
    name: Multi-architecture image tags
    needs: [prepare, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Tag VERSION and latest for x64 and ARM64
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for name in easypatch-server easypatch-proxy; do
            image="ghcr.io/${owner}/${name}"
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "index:org.opencontainers.image.licenses=FSL-1.1-ALv2" \
              --annotation "index:org.opencontainers.image.version=${VERSION}" \
              -t "${image}:${VERSION}" -t "${image}:latest" \
              "${image}:${VERSION}-amd64" "${image}:${VERSION}-arm64"
            docker buildx imagetools inspect "${image}:${VERSION}"
          done
          docker logout ghcr.io

  publish:
    name: GitHub Release
    needs: [prepare, windows-agent, linux-agent, macos-agent, manifests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - name: Verify architectures, release signatures and write SHA256SUMS
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir release
          cp dist/windows-agent/* dist/linux-agent/* dist/macos-agent/* release/
          # Each MSI must be built for its own architecture (summary Template "<platform>;<languages>").
          if cmp -s "release/EasyPatchAgent-${VERSION}-x64.msi" "release/EasyPatchAgent-${VERSION}-arm64.msi"; then
            echo "::error::The x64 and arm64 MSIs are identical"
            exit 1
          fi
          grep -a -q -E 'x64;[0-9]+' "release/EasyPatchAgent-${VERSION}-x64.msi"
          grep -a -q -E 'Arm64;[0-9]+' "release/EasyPatchAgent-${VERSION}-arm64.msi"
          # The same for the Linux packages: package metadata and the agent executable's machine type.
          command -v rpm > /dev/null || { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends rpm; }
          for spec in x64:amd64:x86_64:x86-64 arm64:arm64:aarch64:aarch64; do
            IFS=: read -r name deb_arch rpm_arch elf <<< "$spec"
            deb="release/EasyPatchAgent-${VERSION}-${name}.deb"
            rpm="release/EasyPatchAgent-${VERSION}-${name}.rpm"
            [ "$(dpkg-deb -f "$deb" Architecture)" = "$deb_arch" ] || { echo "::error::$deb is not $deb_arch"; exit 1; }
            dpkg-deb --fsys-tarfile "$deb" | tar -xO ./opt/easypatch/easypatch-agent > "$RUNNER_TEMP/agent-$name"
            file -b "$RUNNER_TEMP/agent-$name" | grep -q "$elf" || { echo "::error::$deb does not contain a $elf agent"; exit 1; }
            [ "$(rpm -qp --qf '%{ARCH}' "$rpm")" = "$rpm_arch" ] || { echo "::error::$rpm is not $rpm_arch"; exit 1; }
          done
          # And the macOS packages: Distribution hostArchitectures, the agent executable's Mach-O CPU type and code
          # signature, and the payload's owners and modes (check-pkg.py reads the xar archive itself).
          python3 -I agent/Installer/macos/check-pkg.py \
            "release/EasyPatchAgent-${VERSION}-x64.pkg" "release/EasyPatchAgent-${VERSION}-arm64.pkg"
          dotnet run --project tools/EasyPatch.ReleaseSigner -c Release -- \
            verify --public-key "$PUBLIC_KEY" release/*.msi release/*.deb release/*.rpm release/*.pkg
          cp "$PUBLIC_KEY" release/
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          sed "s/@VERSION@/${VERSION}/g" .github/release-notes.md >> notes.md
      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "EasyPatch ${VERSION}" --notes-file notes.md
