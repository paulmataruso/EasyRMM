# Local / lab override: Caddy's internal CA instead of ACME, published on 127.0.0.1 unless EASYPATCH_BIND_ADDRESS
# names another host address.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Set EASYPATCH_DOMAIN=localhost in .env, then open https://localhost:8443 (accept the certificate warning, or
# trust Caddy's root CA). See docs/installation.md.
services:
  api:
    environment:
      EasyPatch__PublicUrl: https://${EASYPATCH_DOMAIN:-localhost}:${EASYPATCH_HTTPS_PORT:-8443}

  worker:
    environment:
      EasyPatch__PublicUrl: https://${EASYPATCH_DOMAIN:-localhost}:${EASYPATCH_HTTPS_PORT:-8443} # links in notifications

  caddy:
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.dev", "--adapter", "caddyfile"]
    environment:
      EASYPATCH_DOMAIN: ${EASYPATCH_DOMAIN:-localhost}
      ACME_EMAIL: unused@localhost.invalid
    ports: !override
      - "${EASYPATCH_BIND_ADDRESS:-127.0.0.1}:${EASYPATCH_HTTPS_PORT:-8443}:443"
