<!-- EasyRMM wordmark for dark backgrounds, built like the EasyPatch wordmark. viewBox cropped to the artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="38 53 730 182">
  <defs>
    <linearGradient id="easy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#78b9c9"/>
    </linearGradient>
    <linearGradient id="rmm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35f2ed"/>
      <stop offset=".5" stop-color="#22c3f0"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
  </defs>
  <text x="40" y="170" font-family="Arial, sans-serif"
    font-size="155" font-style="italic" font-weight="800"
    letter-spacing="-7" fill="url(#easy)">Easy</text>
  <text x="390" y="170" font-family="Arial, sans-serif"
    font-size="155" font-style="italic" font-weight="800"
    letter-spacing="-7" fill="url(#rmm)">RMM</text>
  <path d="M80 195 Q410 255 740 195"
    fill="none" stroke="#00d6d8" stroke-width="7" stroke-linecap="round"/>
</svg>
