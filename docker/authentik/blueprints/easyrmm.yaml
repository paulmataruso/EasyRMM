# Authentik for EasyRMM (one-product plan, phase A; ADR-0044). The authentik
# services of deploy/docker-compose.yml mount this blueprint; Authentik's
# worker applies it at the first start and again whenever it changes.
#
# It makes:
#   * the OpenID provider and application EasyRMM signs in with, with the
#     client secret setup.sh generated and EasyRMM's one redirect URI;
#   * a second factor (an authenticator app or a security key) required at
#     every sign-in, and set up at the first one if missing;
#   * sign-in without self-registration;
#   * the enrollment flow invitations open: name, password, second factor,
#     then on to EasyRMM, where the account signs straight in.
#
# Invitations are not made here. A blueprint is applied again from time to
# time, so a single-use invitation, deleted when used, would come back. The
# authentik-setup service makes them, once, from what setup.sh decided.
#
# Settings people may not change, such as their email address, are
# Authentik's system settings, which blueprints cannot set: authentik-setup
# sets those too (docker/authentik/setup.py).
version: 1
metadata:
  name: EasyRMM - Sign-in
  labels:
    blueprints.goauthentik.io/description: |
      EasyRMM's OpenID provider and application, a required second factor, no self-registration,
      and the enrollment flow of EasyRMM's invitations. Managed by EasyRMM's deployment.
context:
  public_url: !Env EASYRMM_PUBLIC_URL
entries:
  # What this builds on must be there first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Authentication flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - TOTP MFA setup flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - WebAuthn MFA setup flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true

  # --- Signing in: a second factor, every time ---------------------------------
  # The default flow's second-factor stage skips people who have none. Here
  # it asks for an authenticator app or a security key, and has anyone
  # without one set one up before they get in.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    identifiers:
      name: default-authentication-mfa-validation
    attrs:
      device_classes: [totp, webauthn]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
  # No self-registration: the sign-in page offers no enrollment, and no
  # password recovery by email (Authentik sends no email here).
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      # As Authentik's own blueprint has it; its validation wants them here.
      user_fields:
        - email
        - username
      enrollment_flow: null
      recovery_flow: null

  # --- Enrollment, by invitation only --------------------------------------------
  - model: authentik_flows.flow
    id: enrollment
    identifiers:
      slug: easyrmm-enrollment
    attrs:
      name: EasyRMM enrollment
      title: Create your EasyRMM account
      designation: enrollment
      authentication: require_unauthenticated
  - model: authentik_stages_invitation.invitationstage
    id: enrollment-invitation
    identifiers:
      name: easyrmm-enrollment-invitation
    attrs:
      continue_flow_without_invitation: false
  # The invitation fixes the email address and the username (the same
  # address): the form shows the address and takes no other.
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-email
    identifiers:
      name: easyrmm-enrollment-field-email
    attrs:
      field_key: email
      label: Email
      type: text_read_only
      required: false
      order: 0
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-name
    identifiers:
      name: easyrmm-enrollment-field-name
    attrs:
      field_key: name
      label: Your name
      type: text
      required: true
      placeholder: Your name
      order: 10
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password
    identifiers:
      name: easyrmm-enrollment-field-password
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      sub_text: At least 12 characters.
      order: 20
  - model: authentik_stages_prompt.prompt
    id: enrollment-field-password-repeat
    identifiers:
      name: easyrmm-enrollment-field-password-repeat
    attrs:
      field_key: password_repeat
      label: Confirm password
      type: password
      required: true
      placeholder: Confirm password
      order: 30
  - model: authentik_policies_password.passwordpolicy
    id: enrollment-password-policy
    identifiers:
      name: easyrmm-enrollment-password
    attrs:
      password_field: password
      length_min: 12
      check_static_rules: true
      check_zxcvbn: true
      zxcvbn_score_threshold: 2
      # No call to a third party with (part of) a password hash.
      check_have_i_been_pwned: false
      error_message: Use at least 12 characters, and nothing easy to guess.
  - model: authentik_stages_prompt.promptstage
    id: enrollment-prompt
    identifiers:
      name: easyrmm-enrollment-prompt
    attrs:
      fields:
        - !KeyOf enrollment-field-email
        - !KeyOf enrollment-field-name
        - !KeyOf enrollment-field-password
        - !KeyOf enrollment-field-password-repeat
      validation_policies:
        - !KeyOf enrollment-password-policy
  - model: authentik_stages_user_write.userwritestage
    id: enrollment-write
    identifiers:
      name: easyrmm-enrollment-write
    attrs:
      user_creation_mode: always_create
      create_users_as_inactive: false
      user_type: internal
      user_path_template: users
  - model: authentik_stages_user_login.userloginstage
    id: enrollment-login
    identifiers:
      name: easyrmm-enrollment-login
  # A second factor before anything else: the same choice as at sign-in.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: enrollment-mfa
    identifiers:
      name: easyrmm-enrollment-mfa
    attrs:
      device_classes: [totp, webauthn]
      not_configured_action: configure
      configuration_stages:
        - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]
        - !Find [authentik_stages_authenticator_webauthn.authenticatorwebauthnstage, [name, default-authenticator-webauthn-setup]]
  # Then on to EasyRMM's sign-in through this provider (its id is
  # sso.DeploymentProviderID), which completes without asking again.
  - model: authentik_stages_redirect.redirectstage
    id: enrollment-redirect
    identifiers:
      name: easyrmm-enrollment-redirect
    attrs:
      mode: static
      target_static: !Format ["%s/api/v1/auth/sso/b2927669-72ce-48a1-a83d-8215013be7ab/start", !Context public_url]
      keep_context: false
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment
      stage: !KeyOf enrollment-invitation
      order: 10
    attrs:
      evaluate_on_plan: true
      re_evaluate_policies: true
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment
      stage: !KeyOf enrollment-prompt
      order: 20
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment
      stage: !KeyOf enrollment-write
      order: 30
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment
      stage: !KeyOf enrollment-login
      order: 40
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment
      stage: !KeyOf enrollment-mfa
      order: 50
  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf enrollment
      stage: !KeyOf enrollment-redirect
      order: 60

  # --- EasyRMM -------------------------------------------------------------------
  # Its issuer is https://<sign-in name>/application/o/easyrmm/. EasyRMM
  # reads no groups: roles are granted in EasyRMM only (ADR-0044).
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers:
      name: EasyRMM
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: easyrmm
      client_secret: !Env EASYRMM_AUTHENTIK_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/v1/auth/sso/callback", !Context public_url]
          redirect_uri_type: authorization
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      sub_mode: hashed_user_id
      issuer_mode: per_provider
      include_claims_in_id_token: true
      access_code_validity: minutes=1
  - model: authentik_core.application
    identifiers:
      slug: easyrmm
    attrs:
      name: EasyRMM
      provider: !KeyOf provider
      meta_launch_url: !Context public_url
      policy_engine_mode: any
