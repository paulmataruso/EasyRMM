# Publishes a release when an EasyRMM version tag (easyrmm-v1.2.3, or a
# pre-release such as easyrmm-v1.2.3-rc.1) is pushed to this repository.
# EasyPatch's tags (easypatch-v...) have their own workflow,
# easypatch-release.yml. The version is the tag without "easyrmm-" (v1.2.3):
# the server, the console and the agents report it, as before.
#
#   1. the tag and its CHANGELOG.md section are checked;
#   2. every CI check runs again on the tagged commit;
#   3. the server image is built, scanned and pushed for amd64 and arm64 with
#      an SBOM and build provenance, tagged 1.2.3, 1.2 and latest (pre-releases
#      get only their own tag);
#   4. the deployment bundle and agents are built (scripts/release/bundle.sh),
#      attested, and attached to a GitHub release with the changelog's notes.
#
# Pull requests and forks never publish. See docs/development/releasing.md.
name: Release

on:
  push:
    tags: ["easyrmm-v[0-9]+.[0-9]+.[0-9]+", "easyrmm-v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/easyrmm-server

jobs:
  prepare:
    name: Check the tag and its notes
    if: github.repository_owner == 'paulmataruso'
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eqx 'easyrmm-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?'; then
            echo "::error::$TAG is not a release tag (easyrmm-v1.2.3 or easyrmm-v1.2.3-rc.1)"; exit 1
          fi
          version=${TAG#easyrmm-}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case $version in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          scripts/release/notes.sh "$TAG" > /dev/null

  backend:
    name: Backend
    needs: prepare
    uses: ./.github/workflows/backend-tests.yml

  integration:
    name: Integration
    needs: prepare
    uses: ./.github/workflows/integration-tests.yml

  frontend:
    name: Frontend
    needs: prepare
    uses: ./.github/workflows/frontend-tests.yml

  image:
    name: Server image
    needs: [prepare, backend, integration, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          load: true
          push: false
          tags: easyrmm-server:release
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image reports the release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker run --rm easyrmm-server:release version | grep -qF "$VERSION"
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: easyrmm-server:release
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest only for a release, never a pre-release; {{major}}.{{minor}} likewise.
          # The version comes from prepare: the tag itself (easyrmm-v...) is not semver.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: GitHub release
    needs: [prepare, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release/bundle.sh "$TAG" dist/release
          scripts/release/notes.sh "$TAG" > dist/notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/release/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # EasyRMM's releases are this repository's "Latest" (EasyPatch's never are); a pre-release never is.
          flags="--latest"
          if [ "$PRERELEASE" = true ]; then flags="--prerelease --latest=false"; fi
          # shellcheck disable=SC2086 # flags is one or two words, none with spaces
          gh release create "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "EasyRMM ${TAG#easyrmm-v}" \
            --notes-file dist/notes.md $flags
