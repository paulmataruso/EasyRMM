# EasyPatch's server, EasyRMM's patching engine: backend build and tests, and the server image (built and checked,
# not pushed).
#
# Called by ci.yml (job "EasyPatch server") when its changes job finds a change to EasyPatch or its workflows
# other than the agent, the docs and Markdown, or to EasyRMM's client of the engine (server/internal/easypatch/);
# ci.yml's concurrency group cancels superseded pull request runs. release.yml calls it again on the tagged commit
# before anything is published. Can also be run by hand.
#
# EasyPatch lives in easypatch/: run steps work there (defaults below), and every path given to an action carries
# the prefix.
name: EasyPatch server

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

defaults:
  run:
    working-directory: easypatch

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: easypatch/global.json
      - name: Build
        run: |
          dotnet build backend/API/EasyPatch.Api.csproj -c Release
          dotnet build backend/Worker/EasyPatch.Worker.csproj -c Release
          dotnet build backend/Tests/EasyPatch.Tests.csproj -c Release
      - name: Test (unit and integration; PostgreSQL via Testcontainers)
        run: dotnet test backend/Tests/EasyPatch.Tests.csproj -c Release --no-build
      # Shipped code only: the server, the worker and the agent's projects, not tests or tools.
      # Permissive licences only (ADR-0037); PDFsharp 6.5 and later, for one, are AGPL.
      - name: Package licence check
        run: |
          set -- backend/API backend/Worker
          for project in agent/*/*.csproj; do
            case $project in *Tests*) ;; *) set -- "$@" "$(dirname "$project")" ;; esac
          done
          for p in "$@"; do dotnet restore "$p" --verbosity quiet; done
          python3 ../scripts/ci/check-nuget-licences.py "$@"
      - name: Vulnerable package check
        run: |
          dotnet list backend/API/EasyPatch.Api.csproj package --vulnerable --include-transitive | tee vulnerable.txt
          dotnet list backend/Worker/EasyPatch.Worker.csproj package --vulnerable --include-transitive | tee -a vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then exit 1; fi

  images:
    name: Server image
    needs: [backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: easypatch/global.json
      # The server image carries agent packages (ADR-0041). CI's carry Linux packages signed with a key
      # made for this run, which only their own agents trust; the script checks the release key refuses them.
      - name: Agent packages signed with a test key
        run: scripts/build-test-agent-packages.sh --arch all
      - name: Build the image
        run: docker build -f deployment/server/Dockerfile -t easypatch-server:ci .
      - name: The server image carries the staged agent packages, read-only
        run: scripts/check-image-agent-packages.sh easypatch-server:ci
      - name: Check the image contains no secrets or source-control metadata
        run: |
          if docker run --rm --entrypoint sh easypatch-server:ci -c 'find / -xdev \( -name ".env" -o -name "db_password" -o -name "*.pfx" -o -name ".git" \) -not -path "/proc/*" 2>/dev/null' < /dev/null | grep .; then
            echo "unexpected file in easypatch-server:ci" >&2
            exit 1
          fi
          echo "easypatch-server:ci: no secrets or source-control metadata"
