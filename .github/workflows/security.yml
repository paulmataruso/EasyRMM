# Supply-chain and code security checks. Any finding at the configured
# severity fails the workflow. They cover the whole repository, EasyRMM and
# EasyPatch (easypatch/), for every change: ci.yml runs this workflow
# unconditionally, and it has no path filter.
name: Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly, to catch newly published vulnerabilities

permissions:
  contents: read

jobs:
  # Every commit reachable from the checked-out commit, every time: it takes
  # seconds. (gitleaks-action scans only a pull request's own range, which it
  # cannot work out when the range brings in another repository's history,
  # as EasyPatch's import did, nor beyond its 250th commit.) Findings that are
  # not secrets are listed in .gitleaksignore.
  secrets:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the history
        shell: bash
        # The image runs as root and the checkout belongs to the runner's
        # user, so git needs safe.directory. When git fails, gitleaks still
        # says "no leaks found" and exits 0: a scan of no commits fails here.
        run: |
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --verbose --log-opts=HEAD /repo 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if ! grep -qE '[1-9][0-9]* commits scanned' "$RUNNER_TEMP/gitleaks.log" || grep -q 'stderr is not empty' "$RUNNER_TEMP/gitleaks.log"; then
            echo "::error::gitleaks could not read the history"
            exit 1
          fi

  govulncheck:
    name: Go vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check Go module licences against the allow-list
        run: |
          go run github.com/google/go-licenses/v2@v2.0.1 check ./... \
            --allowed_licenses=MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MPL-2.0 \
            --ignore github.com/paulmataruso/easyrmm
      - name: Licence inventory
        run: |
          go run github.com/google/go-licenses/v2@v2.0.1 report ./... \
            --ignore github.com/paulmataruso/easyrmm > go-licenses.csv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licence-inventory
          path: go-licenses.csv
          retention-days: 30
      # The consoles' production npm packages ship in their bundles: permissive
      # licences only (ADR-0037).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the consoles' dependencies
        run: |
          (cd web && npm ci --no-audit --no-fund --ignore-scripts)
          (cd easypatch/frontend && npm ci --no-audit --no-fund --ignore-scripts)
      - name: Check npm package licences against the allow-list
        run: node scripts/ci/check-npm-licences.mjs web easypatch/frontend

  trivy:
    name: Filesystem scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Exceptions scoped to files, each with its reason.
          TRIVY_IGNOREFILE: .trivyignore.yaml
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Go (EasyRMM), C# (EasyPatch, in easypatch/) and JavaScript/TypeScript
  # (both web consoles). C# is analysed from a real build of the whole
  # EasyPatch solution, which builds on Linux, Windows projects included.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: easypatch/global.json
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Build EasyPatch
        if: matrix.language == 'csharp'
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
        run: dotnet build easypatch/EasyPatch.slnx -c Release -p:UseSharedCompilation=false
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
