# Static checks, unit tests and build verification for Go code.
name: Backend tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Format, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: make vet
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # Workflow files are code too: actionlint (with shellcheck) catches
      # expression mistakes and run: scripts that do not fail when they should.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test (race detector)
        run: go run gotest.tools/gotestsum@v1.13.0 --format testname --jsonfile unit-tests.json -- -race -count=1 ./...
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-unit-test-report
          path: unit-tests.json
          retention-days: 14

  # The agent's Windows code: services, access lists, inventory and metrics
  # from the real machine, PowerShell and cmd jobs. GitHub's Windows runners
  # run as an administrator, as the agent's service does.
  windows:
    name: Agent tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -count=1 -v ./agent/... ./internal/agentproto/...
      - name: Build the Windows agents
        run: |
          go build -trimpath -o easyrmm-agent-windows-amd64.exe ./agent/cmd/easyrmm-agent
          ./easyrmm-agent-windows-amd64.exe version

  build:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build every package
        run: go build ./...
