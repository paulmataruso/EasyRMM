# Static checks, unit tests and build verification for Go code.
name: Backend tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Format, vet, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet
        run: make vet
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      # The scripts that run under each distribution's sh: the machine
      # harness's runner and the hardening script (ADR-0051). ShellCheck
      # pinned, as releases before 0.10 take the functions a trap runs
      # for unreachable code (SC2317).
      - name: shellcheck the scripts that run under sh
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
          -s sh internal/vmtest/runner.sh server/internal/jobs/hardening/linux.sh
      - name: shellcheck setup.sh and its mail options
        run: shellcheck -x deploy/scripts/setup.sh deploy/scripts/setup-mail.sh deploy/scripts/setup-mail_test.sh
      # Workflow files are code too: actionlint (with shellcheck) catches
      # expression mistakes and run: scripts that do not fail when they should.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test (race detector)
        run: go run gotest.tools/gotestsum@v1.13.0 --format testname --jsonfile unit-tests.json -- -race -count=1 ./...
      # As root: setup.sh gives the mail files to root:65532 (ADR-0053).
      - name: setup.sh's mail options (script test)
        run: sudo deploy/scripts/setup-mail_test.sh
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-unit-test-report
          path: unit-tests.json
          retention-days: 14

  # The agent's Windows code: services, access lists, inventory and metrics
  # from the real machine, PowerShell and cmd jobs. GitHub's Windows runners
  # run as an administrator, as the agent's service does.
  windows:
    name: Agent tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test -count=1 -v ./agent/... ./internal/agentproto/...
      # The software and hardening scripts' functions, and the ownership
      # reader's (ADR-0054), as the runner's administrator.
      - name: Windows software and hardening scripts
        run: go test -count=1 -v -run 'OnWindows' ./server/internal/jobs/ ./internal/winpolicy/
      # ADR-0073: defender.status's pinned script runs in Windows PowerShell on
      # stdin params, and its output is decoded by the catalogue's schema.
      # The runner's Defender may be in any state: the test logs what it says
      # (-v) and accepts module_missing, so the job summary records it.
      - name: Windows module scripts (defender.status, hostile values)
        run: go test -count=1 -v -run 'OnWindows' ./server/internal/winmod/...
      # ADR-0083, slice 1: the Group Policy report parser on sample Get-GPOReport XML (no domain is needed), and every
      # Group Policy script run in Windows PowerShell on empty parameters, which must answer with a typed refusal.
      - name: Group Policy module (report parser, scripts)
        run: go test -count=1 -v -run 'OnWindows' ./server/internal/winmod/grouppolicy/
      # ADR-0073, slice 9: the AST check over every catalogue script (no
      # Invoke-Expression, parameters only from standard input, no string or
      # filter built from a value, -AsPlainText only in the pinned helper),
      # then its self-test over the good and bad fixtures. The hostile-value
      # test above sends quotes, $(), backticks, newlines and Unicode through
      # the real parameter path and fails if any is evaluated.
      - name: Windows module scripts (AST check)
        shell: pwsh
        run: ./scripts/ci/check-winmod-ast.ps1
      # ADR-0083: the command-parameter check. The Group Policy tools (GPMC) and the Active Directory module (RSAT) are
      # installed so their commands have metadata; the DNS, DHCP and certificate tools are tried too, and a command whose
      # module is missing is listed as not checked. No domain is needed.
      - name: Install the Group Policy and Active Directory tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $r = Install-WindowsFeature -Name GPMC, RSAT-AD-PowerShell
          $r | Format-List Success, RestartNeeded, ExitCode, FeatureResult | Out-String | Write-Host
          if (-not $r.Success) { throw 'GPMC or RSAT-AD-PowerShell did not install' }
          foreach ($f in 'RSAT-DNS-Server', 'RSAT-DHCP', 'RSAT-ADCS-Mgmt', 'Windows-Server-Backup') {
            $x = Install-WindowsFeature -Name $f
            Write-Host "$f : success=$($x.Success)"
          }
      - name: Windows module scripts (command parameters, Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/ci/check-winmod-commands.ps1 -RequireModules GroupPolicy,ActiveDirectory
      - name: Windows module scripts (command parameters, PowerShell 7)
        shell: pwsh
        run: ./scripts/ci/check-winmod-commands.ps1 -RequireModules GroupPolicy,ActiveDirectory
      # The Group Policy scripts' shared helpers on sample data, in Windows PowerShell 5.1 and in 7 (no domain).
      - name: Group Policy helpers on sample data (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/ci/test-gpo-helpers.ps1
      - name: Group Policy helpers on sample data (PowerShell 7)
        shell: pwsh
        run: ./scripts/ci/test-gpo-helpers.ps1
      # ADR-0065: the disk reader on the runner's disks, through the same
      # IOCTLs the agent sends. They are Azure virtual disks: NVMe ones,
      # which the NVMe path reads, or, on some runners, Hyper-V's virtual
      # SCSI disks, whose driver refuses both pass-throughs; so the ATA path
      # is not exercised here. The runner's user is an elevated
      # administrator, not LocalSystem as the agent's service is.
      - name: Disk health on the runner's disks
        env:
          EASYRMM_TEST_HARDWARE: "1"
        run: go test -count=1 -v -run '^TestMachine$' ./agent/hardware/
      # ADR-0056, slice 0. These tests change the computer (a local user,
      # the agent's folders and service), so they run only here, on a runner
      # made for the job. The update starts from main as it was before the
      # state check: the first parent of PR #61's merge, built from source.
      - name: Build the agent from before the state check, and this one
        shell: bash
        env:
          MERGE: 80c18670b87287abd271b3255bec98850716c706 # PR #61
        run: |
          git fetch --no-tags --depth=2 origin "$MERGE"
          before=$(git rev-parse "$MERGE^1")
          git worktree add --detach "$RUNNER_TEMP/before" "$before"
          go build -C "$RUNNER_TEMP/before" -trimpath -ldflags "-X main.Version=0.0.0-before-state-check" \
            -o "$RUNNER_TEMP/easyrmm-agent-before.exe" ./agent/cmd/easyrmm-agent
          go build -trimpath -ldflags "-X main.Version=0.0.0-state-check" \
            -o "$RUNNER_TEMP/easyrmm-agent-after.exe" ./agent/cmd/easyrmm-agent
      - name: State check against a standard user, and an update to it
        env:
          EASYRMM_TEST_MACHINE: "1"
          EASYRMM_TEST_AGENT_BEFORE: ${{ runner.temp }}\easyrmm-agent-before.exe
          EASYRMM_TEST_AGENT_AFTER: ${{ runner.temp }}\easyrmm-agent-after.exe
        run: go test -count=1 -v -run '^(TestStandardUserPlantsState|TestUpdateFromBeforeTheStateCheck|TestRepairInstallOnWindows)$' ./agent/cmd/easyrmm-agent/
      # ADR-0056: the enrollment file is read only where the owner, the access
      # list and every folder above it are the administration's. Elevated, as
      # the runner is: the tests make files owned by another account.
      - name: Enrollment file checks (access lists, links, held open)
        run: go test -count=1 -v -run 'OpenPrivate' ./agent/host/
      - name: Build the Windows agents
        run: |
          go build -trimpath -o easyrmm-agent-windows-amd64.exe ./agent/cmd/easyrmm-agent
          ./easyrmm-agent-windows-amd64.exe version
      # ADR-0049: what signtool makes, the agent just built included, is
      # what the server's Authenticode reader accepts.
      - name: Authenticode reader against signtool
        env:
          EASYRMM_AUTHENTICODE_PROGRAM: ${{ github.workspace }}\easyrmm-agent-windows-amd64.exe
        run: go test -count=1 -v -run 'OnWindows' ./server/internal/agents/authenticode/

  # ADR-0064: PowerShell 7 as the agent's service sees it. The tests run as
  # LocalSystem through a scheduled task: as the runner's administrator they
  # would test something else, since the account the agent runs as is
  # trusted too. PowerShell 7 comes from Microsoft's MSI, the x86 build from
  # Microsoft's ZIP, both pinned by the SHA-256 Microsoft's release lists;
  # the Store package from winget where the runner has it. The steps run in
  # Windows PowerShell, as the image's PowerShell 7 is removed first.
  windows-system:
    name: PowerShell 7 as LocalSystem (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
            msi-sha256: 7d8daea48b450d4d62fcd1ac4d6faa7ac2db5e11aba5061ee81b7496adca8c07
          - runner: windows-11-arm
            arch: arm64
            msi-sha256: 732af00c51162ecb6826ba630f19bf6536c3ce7c3b740160660ddcfb51606780
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: powershell
    env:
      PWSH_VERSION: 7.6.10
      PWSH_ARCH: ${{ matrix.arch }}
      PWSH_MSI_SHA256: ${{ matrix.msi-sha256 }}
      PWSH_X86_ZIP_SHA256: 221bad2ba6eff81f2661c8f467eca286f89173b0e0c044c858f18dbbeacb9891
      PWSH_MSIX_SHA256: c6caa271d179dae426b3536fb17569707033519649b471ad52858bf11c46149d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Remove the image's PowerShell 7
        run: |
          $installed = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty |
            Where-Object { $_.DisplayName -like 'PowerShell 7*' }
          foreach ($p in $installed) {
            Write-Output "Removing $($p.DisplayName) $($p.DisplayVersion)"
            $run = Start-Process -FilePath msiexec.exe -ArgumentList '/x', $p.PSChildName, '/qn', '/norestart' -Wait -PassThru
            if ($run.ExitCode -notin 0, 3010) { throw "msiexec /x ended with $($run.ExitCode)" }
          }
          $left = Join-Path $env:ProgramFiles 'PowerShell\7'
          if (Test-Path $left) { Remove-Item -Recurse -Force $left }
      # The images' lists do not name winget. windows-11-arm has none (seen
      # 2026-11-22), so there the step installs the package winget's manifest
      # names for this version, Microsoft's LTS MSIX bundle, pinned by the
      # SHA-256 both the release and the manifest give, as winget would.
      - name: PowerShell 7's Store package
        run: |
          if (Get-Command winget.exe -ErrorAction SilentlyContinue) {
            winget --version
            winget install --id Microsoft.PowerShell --exact --version "$env:PWSH_VERSION.0" --installer-type msix --source winget `
              --accept-package-agreements --accept-source-agreements --disable-interactivity
            if ($LASTEXITCODE) { throw "winget ended with $LASTEXITCODE" }
          } else {
            Write-Output '::warning::winget is not on this runner; the MSIX bundle is installed with Add-AppxPackage.'
            $ProgressPreference = 'SilentlyContinue'
            $name = "PowerShell-LTS-$env:PWSH_VERSION.msixbundle"
            $bundle = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest -UseBasicParsing -OutFile $bundle -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$env:PWSH_VERSION/$name"
            $sum = (Get-FileHash -Algorithm SHA256 -Path $bundle).Hash.ToLowerInvariant()
            if ($sum -ne $env:PWSH_MSIX_SHA256) { throw "$name has the SHA-256 $sum" }
            Add-AppxPackage -Path $bundle
          }
          $package = Get-AppxPackage -Name 'Microsoft.PowerShell*' | Where-Object { $_.Version -eq "$env:PWSH_VERSION.0" } | Select-Object -First 1
          if (-not $package) {
            Get-AppxPackage -AllUsers -Name '*PowerShell*' | Format-List Name, PackageFullName, InstallLocation | Out-String | Write-Output
            throw 'No Store package of PowerShell 7 was installed.'
          }
          Write-Output "Store package: $($package.PackageFullName) in $($package.InstallLocation)"
          Add-Content -Path $env:GITHUB_ENV -Encoding Ascii -Value "EASYRMM_TEST_PWSH_STORE=$(Join-Path $package.InstallLocation 'pwsh.exe')"
      - name: PowerShell 7 from Microsoft's MSI
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $name = "PowerShell-$env:PWSH_VERSION-win-$env:PWSH_ARCH.msi"
          $msi = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -UseBasicParsing -OutFile $msi -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$env:PWSH_VERSION/$name"
          $sum = (Get-FileHash -Algorithm SHA256 -Path $msi).Hash.ToLowerInvariant()
          if ($sum -ne $env:PWSH_MSI_SHA256) { throw "$name has the SHA-256 $sum" }
          $run = Start-Process -FilePath msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($run.ExitCode -notin 0, 3010) { throw "msiexec /i ended with $($run.ExitCode)" }
          & (Join-Path $env:ProgramFiles 'PowerShell\7\pwsh.exe') -NoProfile -Command '$PSVersionTable'
      - name: PowerShell 7's x86 ZIP in Program Files (x86)
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $name = "PowerShell-$env:PWSH_VERSION-win-x86.zip"
          $zip = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -UseBasicParsing -OutFile $zip -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$env:PWSH_VERSION/$name"
          $sum = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLowerInvariant()
          if ($sum -ne $env:PWSH_X86_ZIP_SHA256) { throw "$name has the SHA-256 $sum" }
          $dest = Join-Path ${env:ProgramFiles(x86)} 'PowerShell\7'
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content -Path $env:GITHUB_ENV -Encoding Ascii -Value "EASYRMM_TEST_PWSH_X86=$(Join-Path $dest 'pwsh.exe')"
      # windows-latest's image leaves a module in Windows PowerShell's
      # machine folder open to users (ImageHelpers, to Authenticated Users,
      # seen 2026-11-22), and every pwsh run then fails naming it, as
      # ADR-0064 says it must. The tests need that folder as Windows sets it
      # up: the step lists what it finds open or owned by someone else, then
      # gives the whole folder Windows' inherited access list and the
      # Administrators group as owner.
      - name: Close the image's modules to users
        run: |
          $modules = Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules'
          $trusted = 'S-1-5-18', 'S-1-5-32-544', 'S-1-5-80-956008885-3418522649-1831038044-1853292631-2271478464', 'S-1-3-0', 'S-1-3-1'
          $writes = 0x500D0156 # what the agent's check counts as a write right
          foreach ($folder in Get-ChildItem -Path $modules -Directory -Force) {
            $acl = Get-Acl -Path $folder.FullName
            $owner = $acl.GetOwner([Security.Principal.SecurityIdentifier]).Value
            if ($owner -notin $trusted) { Write-Output "$($folder.Name): owned by $owner" }
            foreach ($rule in $acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier])) {
              if ($rule.AccessControlType -eq 'Allow' -and $rule.IdentityReference.Value -notin $trusted -and ([int64]$rule.FileSystemRights -band $writes)) {
                Write-Output "$($folder.Name): $($rule.IdentityReference.Value) may $($rule.FileSystemRights) (inherited: $($rule.IsInherited))"
              }
            }
          }
          icacls $modules /reset /T /C /Q
          if ($LASTEXITCODE) { throw "icacls /reset ended with $LASTEXITCODE" }
          icacls $modules /setowner '*S-1-5-32-544' /T /C /Q
          if ($LASTEXITCODE) { throw "icacls /setowner ended with $LASTEXITCODE" }
      # Both measure agent/powershell, whose Windows half only these tests
      # reach: see its floor below. Windows PowerShell splits an unquoted
      # -flag=./path at its period, so the flag is quoted.
      - name: Build the tests
        run: |
          go test -c -cover "-coverpkg=./agent/powershell" -o "$env:RUNNER_TEMP\powershell.test.exe" ./agent/powershell
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -c -cover "-coverpkg=./agent/powershell" -o "$env:RUNNER_TEMP\jobs.test.exe" ./agent/jobs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Discovery and the whole install's check, as LocalSystem
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/run-as-system.ps1 -Program "$env:RUNNER_TEMP\powershell.test.exe" `
            -Arguments '-test.v', '-test.count=1', '-test.run=AsSystem', "-test.coverprofile=$env:RUNNER_TEMP\powershell-cover.txt" -WorkingDirectory "$env:GITHUB_WORKSPACE\agent\powershell" `
            -Environment 'EASYRMM_TEST_SYSTEM=1', "EASYRMM_TEST_PWSH_X86=$env:EASYRMM_TEST_PWSH_X86", "EASYRMM_TEST_PWSH_STORE=$env:EASYRMM_TEST_PWSH_STORE"
          exit $LASTEXITCODE
      - name: pwsh runs, as LocalSystem
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/run-as-system.ps1 -Program "$env:RUNNER_TEMP\jobs.test.exe" `
            -Arguments '-test.v', '-test.count=1', '-test.run=AsSystem', "-test.coverprofile=$env:RUNNER_TEMP\jobs-cover.txt" -WorkingDirectory "$env:GITHUB_WORKSPACE\agent\jobs" `
            -Environment 'EASYRMM_TEST_SYSTEM=1'
          exit $LASTEXITCODE
      # ADR-0081, slice 4: BitLocker's WMI as the agent calls it, as LocalSystem,
      # on a 64 MiB file-backed virtual disk made for the test: recovery-password
      # protectors are added, read and removed (a rotation's steps), the
      # computer's preconditions are read. Nothing is encrypted and the system
      # drive is never touched; there is no TPM here, so the TPM protector and
      # encryption are not exercised. The tests skip, and say so, on an image
      # whose edition has no BitLocker WMI class.
      - name: BitLocker's WMI on a virtual disk, as LocalSystem
        run: |
          go test -c -o "$env:RUNNER_TEMP\escrow.test.exe" ./agent/escrow
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/run-as-system.ps1 -Program "$env:RUNNER_TEMP\escrow.test.exe" `
            -Arguments '-test.v', '-test.count=1', '-test.run=TestWindows' -WorkingDirectory "$env:GITHUB_WORKSPACE\agent\escrow" `
            -Environment 'EASYRMM_TEST_BITLOCKER=1'
          exit $LASTEXITCODE
      # The Windows half of agent/powershell runs only here, as LocalSystem,
      # so its floor is kept here rather than in check-coverage.sh: the
      # statements of powershell_windows.go that either test binary ran.
      # Set from the 83.2% both runners measured on 2026-11-22. Raise it as
      # coverage grows; never lower it.
      - name: Coverage floor of PowerShell 7's Windows code
        run: |
          $floor = 82.0
          $blocks = @{}
          foreach ($name in 'powershell-cover.txt', 'jobs-cover.txt') {
            foreach ($l in Get-Content -Path (Join-Path $env:RUNNER_TEMP $name)) {
              if ($l -match '/agent/powershell/powershell_windows\.go:(\S+) (\d+) (\d+)$') {
                $key = $Matches[1]
                if (-not $blocks.ContainsKey($key)) { $blocks[$key] = [pscustomobject]@{ Statements = [int]$Matches[2]; Hit = $false } }
                if ([int64]$Matches[3] -gt 0) { $blocks[$key].Hit = $true }
              }
            }
          }
          $total = 0
          $covered = 0
          foreach ($b in $blocks.Values) {
            $total += $b.Statements
            if ($b.Hit) { $covered += $b.Statements }
          }
          if ($total -eq 0) { throw 'No coverage of powershell_windows.go was recorded.' }
          $percent = [math]::Round(100.0 * $covered / $total, 1)
          # Worded so that setup-go's problem matcher, which reads "<file>.go: <text>" as an error, does not.
          Write-Output "Run as LocalSystem: $percent% of the $total statements of agent/powershell/powershell_windows.go (floor $floor%)"
          if ($percent -lt $floor) { throw "Below the floor of $floor%." }

  # ADR-0067: the registry editor's builtin on a real Windows, as LocalSystem,
  # on x64 and ARM64. The test binaries of agent/registry and agent/jobs run
  # through a scheduled task with EASYRMM_TEST_SYSTEM set; the tests make keys
  # under a random name below HKLM\SOFTWARE (links, copies of a test hive saved
  # and loaded under other names, 100,000 subkeys) and remove them. The agent
  # program is built here too, so that a job runs "easyrmm-agent.exe builtin
  # registry" as it does on a computer.
  windows-registry:
    name: Registry editor as LocalSystem (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: powershell
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build the tests and the agent
        run: |
          go test -c -o "$env:RUNNER_TEMP\registry.test.exe" ./agent/registry
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -c -o "$env:RUNNER_TEMP\jobs.test.exe" ./agent/jobs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-X main.Version=0.0.0-registry-test" -o "$env:RUNNER_TEMP\easyrmm-agent.exe" ./agent/cmd/easyrmm-agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: The builtin's reads, as LocalSystem
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/run-as-system.ps1 -Program "$env:RUNNER_TEMP\registry.test.exe" `
            -Arguments '-test.v', '-test.count=1', '-test.timeout=35m', '-test.run=AsSystem' -WorkingDirectory "$env:GITHUB_WORKSPACE\agent\registry" `
            -Environment 'EASYRMM_TEST_SYSTEM=1' -TimeoutMinutes 38
          exit $LASTEXITCODE
      - name: A job runs the agent's builtin, as LocalSystem
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/run-as-system.ps1 -Program "$env:RUNNER_TEMP\jobs.test.exe" `
            -Arguments '-test.v', '-test.count=1', '-test.run=RegistryBuiltinAsSystem' -WorkingDirectory "$env:GITHUB_WORKSPACE\agent\jobs" `
            -Environment 'EASYRMM_TEST_SYSTEM=1', "EASYRMM_TEST_AGENT_EXE=$env:RUNNER_TEMP\easyrmm-agent.exe"
          exit $LASTEXITCODE

  # ADR-0068: the event viewer's builtin on a real Windows, as LocalSystem, on
  # x64 and ARM64. The test binaries of agent/winevent and agent/jobs run
  # through a scheduled task with EASYRMM_TEST_SYSTEM set; the tests write
  # events into the Application log under a source of their own, read the
  # channel list, the Security log (allowed and refused), a provider's metadata
  # and cancel a search of a large log. The agent program is built here too, so
  # that a job runs "easyrmm-agent.exe builtin eventlog" as it does on a
  # computer, with a pipe on its input.
  windows-eventlog:
    name: Event viewer as LocalSystem (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: powershell
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build the tests and the agent
        run: |
          go test -c -o "$env:RUNNER_TEMP\winevent.test.exe" ./agent/winevent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -c -o "$env:RUNNER_TEMP\jobs.test.exe" ./agent/jobs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -trimpath -ldflags "-X main.Version=0.0.0-eventlog-test" -o "$env:RUNNER_TEMP\easyrmm-agent.exe" ./agent/cmd/easyrmm-agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: The builtin's reads, as LocalSystem
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/run-as-system.ps1 -Program "$env:RUNNER_TEMP\winevent.test.exe" `
            -Arguments '-test.v', '-test.count=1', '-test.timeout=20m', '-test.run=AsSystem' -WorkingDirectory "$env:GITHUB_WORKSPACE\agent\winevent" `
            -Environment 'EASYRMM_TEST_SYSTEM=1' -TimeoutMinutes 22
          exit $LASTEXITCODE
      - name: A job runs the agent's builtin and cancels it through its input, as LocalSystem
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/run-as-system.ps1 -Program "$env:RUNNER_TEMP\jobs.test.exe" `
            -Arguments '-test.v', '-test.count=1', '-test.run=EventlogBuiltinAsSystem' -WorkingDirectory "$env:GITHUB_WORKSPACE\agent\jobs" `
            -Environment 'EASYRMM_TEST_SYSTEM=1', "EASYRMM_TEST_AGENT_EXE=$env:RUNNER_TEMP\easyrmm-agent.exe"
          exit $LASTEXITCODE

  # ADR-0070: the agent's Microsoft Defender exclusions on a real Windows
  # with Defender running, not mocked. Step 0 runs the install script a
  # server hands out against a stand-in and proves its order and its
  # clean-up; the rest runs as LocalSystem, as the agent does: exclusions of
  # all four kinds added and removed (a path added by hand survives), a
  # folder Users may write never excluded, DisableLocalAdminMerge reported,
  # not_applicable where Defender is not active, the installed-file hashes,
  # and the AMSI probe, whose result is logged for the ADR and which fails if
  # AMSI is not what it was. Real-time protection is on where the image
  # allows it; where it does not, the tests that need it skip and say why.
  # Not here, for want of a MeshAgent and the EasyPatch agent's slice: the
  # moved work of the winget and agent-update runs, MeshAgent's update, and
  # the .NET extraction folders (steps 5, 7 and 8; the EasyPatch side is
  # slice B). They are untested until run on real devices.
  windows-defender:
    name: Defender exclusions on Windows (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Defender as the image leaves it
        run: |
          Get-MpComputerStatus | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled, IsTamperProtected | Format-List | Out-String | Write-Output
          Get-MpPreference | Select-Object DisableLocalAdminMerge, EnableControlledFolderAccess | Format-List | Out-String | Write-Output
      - name: Build the agent, the install script and the tests
        run: |
          go build -o "$env:RUNNER_TEMP\easyrmm-agent.exe" ./agent/cmd/easyrmm-agent
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:EASYRMM_WRITE_INSTALL_PS1 = "$env:RUNNER_TEMP\install.ps1"
          go test -count=1 -run TestWriteInstallScriptForCI ./server/internal/httpapi/agentapi/
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -c -o "$env:RUNNER_TEMP\defender.test.exe" ./agent/defender
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Step 0, the install script's order and its clean-up
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/defender-install-order.ps1 -Script "$env:RUNNER_TEMP\install.ps1" -Agent "$env:RUNNER_TEMP\easyrmm-agent.exe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Steps 1 to 4, 6, 8a and 9, as LocalSystem
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/run-as-system.ps1 -Program "$env:RUNNER_TEMP\defender.test.exe" `
            -Arguments '-test.v', '-test.count=1', '-test.run=AsSystem', '-test.timeout=30m' `
            -WorkingDirectory "$env:GITHUB_WORKSPACE\agent\defender" -Environment 'EASYRMM_TEST_SYSTEM=1' -TimeoutMinutes 35
          exit $LASTEXITCODE
      - name: Defender is as the image left it
        if: always()
        run: |
          Get-MpComputerStatus | Select-Object AMRunningMode, AntivirusEnabled, RealTimeProtectionEnabled | Format-List | Out-String | Write-Output
          $left = (Get-MpPreference).ExclusionPath | Where-Object { $_ -like '*EasyRMM*' }
          if ($left) { throw "Exclusions were left behind: $left" }

  build:
    name: Build server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build every package
        run: go build ./...

  # ADR-0054, W1: Windows hardening's check on each Windows runner GitHub
  # provides, as the agent's service runs jobs: Windows PowerShell 5.1 as
  # LocalSystem. The test binary runs as LocalSystem through a scheduled
  # task (scripts/ci/run-as-system.ps1, ADR-0064's). The tests plant and
  # remove %ProgramData%\EasyRMM\Hardening, so they run only here, on
  # runners made for the job. Defender and UAC as the images leave them are
  # reported, never changed: a check changes nothing.
  windows-hardening:
    name: Windows hardening as LocalSystem (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # PSScriptAnalyzer 1.24.0, pinned by its SHA-256, and a parse of every
      # script by Windows PowerShell 5.1 and PowerShell 7.
      - name: PowerShell scripts parse and pass PSScriptAnalyzer
        if: matrix.runner == 'windows-2025'
        shell: pwsh
        run: ./scripts/ci/check-powershell.ps1
      # Windows PowerShell 5.1, which runs on every matrix runner (this
      # job's shell), must parse the scripts the agent runs: the hardening
      # script, the ownership reader and the software script. The hardening
      # script's apply and undo logic also runs here on a registry that is a
      # hashtable (TestWindowsApplyUndoFlowOnWindows); the AsSystem tests
      # below run it for real, with TestWindowsHardeningApplyUndoAsSystem.
      - name: Windows PowerShell 5.1 parses the scripts
        run: |
          $bad = 0
          foreach ($f in (Get-ChildItem -Recurse -Filter '*.ps1' -Path server/internal/jobs, internal/winpolicy)) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            foreach ($x in $e) { Write-Host "$($f.FullName):$($x.Extent.StartLineNumber): $($x.Message)"; $bad++ }
          }
          Write-Host "PowerShell $($PSVersionTable.PSVersion): $bad parse error(s)"
          if ($PSVersionTable.PSVersion.Major -ne 5) { Write-Error 'This step is to run Windows PowerShell 5.1.'; exit 1 }
          exit $bad
      - name: Apply and undo logic of the hardening script on PowerShell 5.1
        run: go test -count=1 -v -run 'TestWindowsApplyUndoFlowOnWindows' ./server/internal/jobs/
      - name: Build the tests
        run: |
          go test -c -o "$env:RUNNER_TEMP\winpolicy.test.exe" ./internal/winpolicy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -c -o "$env:RUNNER_TEMP\jobs.test.exe" ./server/internal/jobs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: The ownership reader started on its own, as LocalSystem
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/run-as-system.ps1 -Program "$env:RUNNER_TEMP\winpolicy.test.exe" `
            -Arguments '-test.v', '-test.count=1', '-test.run=AsSystem', '-test.timeout=25m' `
            -WorkingDirectory "$env:GITHUB_WORKSPACE\internal\winpolicy" -Environment 'EASYRMM_TEST_SYSTEM=1'
          exit $LASTEXITCODE
      - name: Check every module, and the Hardening folder's check, as LocalSystem
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./scripts/ci/run-as-system.ps1 -Program "$env:RUNNER_TEMP\jobs.test.exe" `
            -Arguments '-test.v', '-test.count=1', '-test.run=AsSystem', '-test.timeout=50m' `
            -WorkingDirectory "$env:GITHUB_WORKSPACE\server\internal\jobs" -Environment 'EASYRMM_TEST_SYSTEM=1' -TimeoutMinutes 55
          exit $LASTEXITCODE
