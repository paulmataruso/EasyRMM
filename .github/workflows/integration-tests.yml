# Go integration tests against a real PostgreSQL (same version and roles as
# production), with per-package coverage floors. The database runs with
# Docker host networking, as in production.
name: Integration tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Start PostgreSQL
        run: make test-db
      - name: Unit + integration tests with coverage gates
        env:
          EASYRMM_TEST_DATABASE_URL: postgres://postgres:easyrmm-test-only@127.0.0.1:55432/postgres?sslmode=disable
        run: make test-integration
      - name: Coverage report
        if: always()
        run: |
          if [ -f coverage.txt ]; then
            go tool cover -html=coverage.txt -o coverage.html
            go tool cover -func=coverage.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: |
            coverage.txt
            coverage.html
          retention-days: 14
          if-no-files-found: ignore
      - name: Database logs on failure
        if: failure()
        run: docker logs easyrmm-testdb | tail -200
