# Go integration tests against a real PostgreSQL (same version and roles as
# production) and a real MeshCentral (the release production runs, with a
# real MeshAgent connecting through the EasyRMM gateway) and a real OpenID
# Connect provider (Dex) and real SMTP servers (Mailpit), with per-package
# coverage floors. All run with Docker host networking, as in production.
name: Integration tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL, MeshCentral and Dex integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Start PostgreSQL
        run: make test-db
      - name: Start MeshCentral
        run: make test-mesh
      - name: Start Dex (OpenID Connect provider)
        run: make test-oidc
      - name: Start Mailpit (SMTP)
        run: make test-mail
      - name: Pull the test agent image
        run: docker pull "$(make -s print-test-agent-image)"
      - name: Unit + integration tests with coverage gates
        env:
          EASYRMM_TEST_DATABASE_URL: postgres://postgres:easyrmm-test-only@127.0.0.1:55432/postgres?sslmode=disable
        run: make test-integration
      - name: Coverage report
        if: always()
        run: |
          if [ -f coverage.txt ]; then
            go tool cover -html=coverage.txt -o coverage.html
            go tool cover -func=coverage.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: |
            coverage.txt
            coverage.html
          retention-days: 14
          if-no-files-found: ignore
      - name: Database logs on failure
        if: failure()
        run: docker logs easyrmm-testdb | tail -200
      - name: MeshCentral logs on failure
        if: failure()
        run: docker logs easyrmm-testmesh 2>&1 | tail -200
      - name: Dex logs on failure
        if: failure()
        run: docker logs easyrmm-testoidc 2>&1 | tail -200
      - name: Mailpit logs on failure
        if: failure()
        run: |
          for m in plain starttls tls; do docker logs "easyrmm-testmail-$m" 2>&1 | tail -100; done
