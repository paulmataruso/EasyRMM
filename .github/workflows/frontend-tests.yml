# The technician console: typecheck, unit tests with coverage floors, the
# production build, and browser end-to-end tests against a real server and
# PostgreSQL (host networking, as in production).
name: Frontend tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Typecheck, unit tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Lifecycle scripts stay off: no dependency runs code at install time.
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run typecheck
      - name: Unit tests with coverage floors
        run: npm run test:coverage
      - name: Production build
        run: npx vite build
      # Impeccable's deterministic design detector (ADR-0012). The launcher is
      # committed and verifies the engine it downloads against pinned checksums.
      - name: Design detector
        working-directory: .
        run: .claude/skills/impeccable/scripts/impeccable detect --github web/src
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-coverage
          path: web/coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Install Chromium for Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start PostgreSQL
        run: make test-db
      - name: Build the console, embed it, run the suite
        run: make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/e2e/.report
            web/e2e/.results
          retention-days: 7
          if-no-files-found: ignore
          # The report and results directories start with a dot, which
          # upload-artifact leaves out unless told otherwise.
          include-hidden-files: true
      - name: Database logs on failure
        if: failure()
        run: docker logs easyrmm-testdb | tail -200
