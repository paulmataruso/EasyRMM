# Builds the server image once, for linux/amd64 and linux/arm64, into an OCI
# image layout; scans it; and smoke-tests the Compose deployment exactly as
# an operator would run it (host networking, setup script, PostgreSQL init,
# migrations, health check). Nothing is pushed here: ci.yml's end-to-end
# jobs run the same image, and for a push to main its last job pushes this
# layout unchanged once every other job passed (ADR-0052).
name: Docker build

on:
  workflow_call:
    inputs:
      version:
        description: The version the image reports (scripts/release/version.sh)
        required: true
        type: string
    outputs:
      digest:
        description: The image index's digest, as pushed from the layout
        value: ${{ jobs.build.outputs.digest }}
      artifact-id:
        description: The ID of the artifact easyrmm-server-image, the layout
        value: ${{ jobs.build.outputs.artifact-id }}
  workflow_dispatch:
    inputs:
      version:
        description: The version the image reports
        required: true
        default: v0.0.0-dispatch
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and scan image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.layout.outputs.digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both platforms, with BuildKit's SBOM and provenance, as they will be
      # pushed: the checks below and ci.yml's jobs use the images in this
      # layout, and nothing builds the image again. Both are scanned and
      # their agents checked; only the amd64 one runs (the runner has no
      # arm64 emulation).
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=easyrmm-server.oci.tar
          build-args: VERSION=${{ inputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      # The digest is the layout's index's, which pushing it keeps; the jobs
      # that load the image later check they have this one.
      - name: Load both images for the checks
        id: layout
        run: |
          digest=$(tar -xOf easyrmm-server.oci.tar index.json | jq -r '.manifests[0].digest')
          if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no image index in the layout: $digest"
            exit 1
          fi
          scripts/ci/load-oci-image.sh easyrmm-server.oci.tar "$digest" linux/amd64 easyrmm-server:ci
          scripts/ci/load-oci-image.sh easyrmm-server.oci.tar "$digest" linux/arm64 easyrmm-server:ci-arm64
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # For the smoke test, ci.yml's end-to-end jobs and its publish job.
      # This order matters: the layout's digest (above) and this artifact's
      # ID are this job's outputs, fixed before the checks and the scanner
      # run. Any step here can reach the artifact service's token; one that
      # replaced the artifact would give it another ID, which the jobs that
      # trust it refuse (they download by ID), and another layout, whose
      # digest they check.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: easyrmm-server-image
          path: easyrmm-server.oci.tar
          retention-days: 3
          # Its layers are compressed already.
          compression-level: 0
          if-no-files-found: error
      - name: Image runs and reports its version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker run --rm easyrmm-server:ci version | grep -qF "$VERSION"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The agents a release builds (scripts/release/agents.sh) are the bytes
      # both images hand out, which ADR-0049's signed agents need.
      - name: Both images' agents are the ones a release builds
        env:
          VERSION: ${{ inputs.version }}
        run: |
          scripts/release/agents.sh "$VERSION" "$RUNNER_TEMP/agents"
          scripts/release/check-agents.sh easyrmm-server:ci "$RUNNER_TEMP/agents"
          scripts/release/check-agents.sh easyrmm-server:ci-arm64 "$RUNNER_TEMP/agents"
      - name: Scan the amd64 image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: easyrmm-server:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan the arm64 image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: easyrmm-server:ci-arm64
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  compose-smoke:
    name: Compose deployment smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: easyrmm-server-image
      - name: Load image
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: scripts/ci/load-oci-image.sh easyrmm-server.oci.tar "$DIGEST" linux/amd64 easyrmm-server:ci
      - name: Prepare host (setup script, manual TLS with a test certificate)
        working-directory: deploy
        run: |
          sudo ./scripts/setup.sh --hostname rmm.ci.example.com --tls-mode manual \
            --cert-file /etc/easyrmm/tls/fullchain.pem --key-file /etc/easyrmm/tls/privkey.pem \
            --data-root /srv/easyrmm-ci
          sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -subj '/CN=rmm.ci.example.com' \
            -addext 'subjectAltName=DNS:rmm.ci.example.com,DNS:mesh.rmm.ci.example.com' \
            -keyout /srv/easyrmm-ci/tls/privkey.pem -out /srv/easyrmm-ci/tls/fullchain.pem
          # Named, not globbed: this shell cannot list the root-only folder.
          sudo chown root:65532 /srv/easyrmm-ci/tls/privkey.pem /srv/easyrmm-ci/tls/fullchain.pem
          sudo chmod 640 /srv/easyrmm-ci/tls/privkey.pem /srv/easyrmm-ci/tls/fullchain.pem
          sudo sed -i -e 's|^EASYRMM_IMAGE=.*|EASYRMM_IMAGE=easyrmm-server|' \
                      -e 's|^EASYRMM_VERSION=.*|EASYRMM_VERSION=ci|' .env
      # EasyRMM's own services: the patching engine's image is built and
      # its services run in CI's "Bundle end to end" job (scripts/e2e/bundle.sh).
      - name: Start the stack
        working-directory: deploy
        run: sudo docker compose up -d --no-build --wait --wait-timeout 180 postgres server meshcentral
      - name: Public edge on 443/80, everything else on loopback
        run: |
          sudo ss -ltnp | tee listeners.txt
          # The non-root server bound privileged ports with only NET_BIND_SERVICE.
          grep -E '(\*|0\.0\.0\.0|\[::\]):443 ' listeners.txt
          grep -E '(\*|0\.0\.0\.0|\[::\]):80 ' listeners.txt
          grep -q '127.0.0.1:15432' listeners.txt
          grep -q '127.0.0.1:18081' listeners.txt
          if grep -E '(\*|0\.0\.0\.0|\[::\]):(15432|18081) ' listeners.txt; then
            echo "PostgreSQL or the MeshCentral backend is listening publicly" >&2; exit 1
          fi
          sudo docker compose -f deploy/docker-compose.yml --env-file deploy/.env exec -T server easyrmm-server version
          [ "$(sudo docker inspect -f '{{.Config.User}}' easyrmm-server-1)" = "65532:65532" ]
      - name: HTTP redirects to HTTPS for our host names only
        run: |
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' -H 'Host: rmm.ci.example.com' http://127.0.0.1/x | tee r.txt
          grep -q '^308 https://rmm.ci.example.com/x$' r.txt
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1/)" = 421 ]
      - name: First-run setup is offered and protected
        run: |
          set -euo pipefail
          base=https://rmm.ci.example.com
          c=(curl -sS --cacert /srv/easyrmm-ci/tls/fullchain.pem --resolve rmm.ci.example.com:443:127.0.0.1
             -H "Origin: $base" -H 'Content-Type: application/json')
          sudo "${c[@]}" -f "$base/api/v1/setup" | tee /dev/stderr | grep -q '"required":true'
          code=$(sudo "${c[@]}" -o /dev/null -w '%{http_code}' -X POST "$base/api/v1/setup" \
            --data '{"token":"wrong","email":"a@ci.example.com","displayName":"CI","password":"correct horse battery staple","organizationName":""}')
          [ "$code" = 422 ]
          token=$(sudo cat /srv/easyrmm-ci/server/setup-token)
          code=$(sudo "${c[@]}" -o /dev/null -w '%{http_code}' -X POST "$base/api/v1/setup" \
            --data "{\"token\":\"$token\",\"email\":\"a@ci.example.com\",\"displayName\":\"CI\",\"password\":\"correct horse battery staple\",\"organizationName\":\"CI Org\"}")
          [ "$code" = 204 ]
          if sudo test -e /srv/easyrmm-ci/server/setup-token; then
            echo "the setup token survived a completed setup" >&2; exit 1
          fi
          sudo "${c[@]}" -f "$base/api/v1/setup" | grep -q '"required":false'
          # Security headers on the real edge.
          sudo "${c[@]}" -D - -o /dev/null "$base/api/v1/health" | tee h.txt
          grep -qi '^strict-transport-security:' h.txt
          grep -qi '^content-security-policy:' h.txt
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: sudo docker compose logs --no-color
      - name: Tear down
        if: always()
        working-directory: deploy
        run: sudo docker compose down -v || true
