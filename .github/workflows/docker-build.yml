# Builds the server image, scans it, and smoke-tests the Compose deployment
# exactly as an operator would run it (host networking, setup script,
# PostgreSQL init, migrations, health check). Images are pushed only for
# pushes to main in this repository, never for pull requests.
name: Docker build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/easyrmm-server

jobs:
  build:
    name: Build and scan image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          load: true
          push: false
          tags: easyrmm-server:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs and reports its version
        run: |
          docker run --rm easyrmm-server:ci version | grep -q "ci-${GITHUB_SHA}"
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: easyrmm-server:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Save image for the smoke test
        run: docker save easyrmm-server:ci | gzip > easyrmm-server-ci.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: easyrmm-server-image
          path: easyrmm-server-ci.tar.gz
          retention-days: 3

  compose-smoke:
    name: Compose deployment smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: easyrmm-server-image
      - name: Load image
        run: gunzip -c easyrmm-server-ci.tar.gz | docker load
      - name: Prepare host (setup script, manual TLS with a test certificate)
        working-directory: deploy
        run: |
          sudo ./scripts/setup.sh --hostname rmm.ci.example.com --tls-mode manual \
            --cert-file /etc/easyrmm/tls/fullchain.pem --key-file /etc/easyrmm/tls/privkey.pem \
            --data-root /srv/easyrmm-ci
          sudo openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -subj '/CN=rmm.ci.example.com' \
            -addext 'subjectAltName=DNS:rmm.ci.example.com,DNS:mesh.rmm.ci.example.com' \
            -keyout /srv/easyrmm-ci/tls/privkey.pem -out /srv/easyrmm-ci/tls/fullchain.pem
          sudo chown root:65532 /srv/easyrmm-ci/tls/*.pem
          sudo chmod 640 /srv/easyrmm-ci/tls/*.pem
          sudo sed -i -e 's|^EASYRMM_IMAGE=.*|EASYRMM_IMAGE=easyrmm-server|' \
                      -e 's|^EASYRMM_VERSION=.*|EASYRMM_VERSION=ci|' .env
      - name: Start the stack
        working-directory: deploy
        run: sudo docker compose up -d --no-build --wait --wait-timeout 180
      - name: Public edge on 443/80, everything else on loopback
        run: |
          sudo ss -ltnp | tee listeners.txt
          # The non-root server bound privileged ports with only NET_BIND_SERVICE.
          grep -E '(\*|0\.0\.0\.0|\[::\]):443 ' listeners.txt
          grep -E '(\*|0\.0\.0\.0|\[::\]):80 ' listeners.txt
          grep -q '127.0.0.1:15432' listeners.txt
          grep -q '127.0.0.1:18081' listeners.txt
          if grep -E '(\*|0\.0\.0\.0|\[::\]):(15432|18081) ' listeners.txt; then
            echo "PostgreSQL or the MeshCentral backend is listening publicly" >&2; exit 1
          fi
          sudo docker compose -f deploy/docker-compose.yml --env-file deploy/.env exec -T server easyrmm-server version
          [ "$(sudo docker inspect -f '{{.Config.User}}' easyrmm-server-1)" = "65532:65532" ]
      - name: HTTP redirects to HTTPS for our host names only
        run: |
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' -H 'Host: rmm.ci.example.com' http://127.0.0.1/x | tee r.txt
          grep -q '^308 https://rmm.ci.example.com/x$' r.txt
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1/)" = 421 ]
      - name: First-run setup is offered and protected
        run: |
          set -euo pipefail
          base=https://rmm.ci.example.com
          c=(curl -sS --cacert /srv/easyrmm-ci/tls/fullchain.pem --resolve rmm.ci.example.com:443:127.0.0.1
             -H "Origin: $base" -H 'Content-Type: application/json')
          sudo "${c[@]}" -f "$base/api/v1/setup" | tee /dev/stderr | grep -q '"required":true'
          code=$(sudo "${c[@]}" -o /dev/null -w '%{http_code}' -X POST "$base/api/v1/setup" \
            --data '{"token":"wrong","email":"a@ci.example.com","displayName":"CI","password":"correct horse battery staple","organizationName":""}')
          [ "$code" = 422 ]
          token=$(sudo cat /srv/easyrmm-ci/server/setup-token)
          code=$(sudo "${c[@]}" -o /dev/null -w '%{http_code}' -X POST "$base/api/v1/setup" \
            --data "{\"token\":\"$token\",\"email\":\"a@ci.example.com\",\"displayName\":\"CI\",\"password\":\"correct horse battery staple\",\"organizationName\":\"CI Org\"}")
          [ "$code" = 204 ]
          if sudo test -e /srv/easyrmm-ci/server/setup-token; then
            echo "the setup token survived a completed setup" >&2; exit 1
          fi
          sudo "${c[@]}" -f "$base/api/v1/setup" | grep -q '"required":false'
          # Security headers on the real edge.
          sudo "${c[@]}" -D - -o /dev/null "$base/api/v1/health" | tee h.txt
          grep -qi '^strict-transport-security:' h.txt
          grep -qi '^content-security-policy:' h.txt
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: sudo docker compose logs --no-color
      - name: Tear down
        if: always()
        working-directory: deploy
        run: sudo docker compose down -v || true

  publish:
    name: Publish image
    needs: [build, compose-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'paulmataruso'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=sha,format=long
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=edge-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
