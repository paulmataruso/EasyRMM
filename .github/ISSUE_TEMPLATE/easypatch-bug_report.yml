name: EasyPatch bug report
description: Something in EasyPatch (EasyRMM's patching engine and its agents, in easypatch/) does not work as documented.
title: "[EasyPatch] "
labels: [bug, easypatch]
body:
  - type: markdown
    attributes:
      value: |
        **Security problems:** do not report them here. Use [Report a vulnerability](https://github.com/paulmataruso/EasyRMM/security/advisories/new) instead.

        Remove host names, IP addresses, tokens, deployment codes and anything else you do not want to publish from logs and screenshots.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
  - type: input
    id: server-version
    attributes:
      label: Server version
      description: The EasyPatch version Settings → EasyPatch shows in EasyRMM, or the commit if you build from source.
      placeholder: "1.11.0"
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version and endpoint OS
      description: If the problem involves an endpoint.
      placeholder: "1.11.0 on Windows 11 24H2 / Ubuntu 24.04"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Server (API, worker, database)
        - Windows agent or MSI
        - Linux agent or packages
        - macOS agent (experimental)
        - Install scripts
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: "Server, in EasyRMM's deploy/ folder: docker compose logs easypatch-api easypatch-worker. Windows agent: C:\\ProgramData\\EasyPatch\\logs\\agent.log. Linux agent: journalctl -u easypatch-agent. macOS agent: /Library/EasyPatch/data/logs/agent.log."
      render: text
