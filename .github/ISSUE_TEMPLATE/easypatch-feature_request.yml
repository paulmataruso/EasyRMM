name: EasyPatch feature request
description: Suggest a change or a new feature for EasyPatch (the patch management product in easypatch/).
title: "[EasyPatch] "
labels: [enhancement, easypatch]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like EasyPatch to handle it.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
