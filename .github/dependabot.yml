version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]
  # Every workflow, EasyRMM's and EasyPatch's (easypatch-*.yml), is in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /docker/server
    schedule:
      interval: weekly

  # EasyPatch (easypatch/), merged from its own dependabot.yml.

  # EasyPatch targets .NET 10 (LTS). Packages that ship with the .NET runtime move together and stay
  # on 10.x; moving to a new .NET major version is a deliberate change, not a Dependabot update.
  - package-ecosystem: nuget
    directory: /easypatch
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
      # PDFsharp 6.5.0 and later are AGPL-3.0; 6.2.x is the last MIT line (ADR-0037).
      - dependency-name: "PDFsharp"
        versions: [">= 6.3.0"]
      - dependency-name: "PDFsharp-MigraDoc"
        versions: [">= 6.3.0"]
    groups:
      dotnet-runtime:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL"
          - "System.*"
          - "dotnet-ef"
      # MimeKit is pinned next to MailKit and must move with it.
      mail:
        patterns:
          - "MailKit"
          - "MimeKit"

  - package-ecosystem: npm
    directory: /easypatch/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: ["minor", "patch"]

  # The .NET images stay on 10.x (LTS) and Node on 24 (LTS), like the packages above.
  - package-ecosystem: docker
    directories:
      - /easypatch/deployment/server
      - /easypatch/deployment/caddy
      - /easypatch/agent/Installer/linux-packages
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
